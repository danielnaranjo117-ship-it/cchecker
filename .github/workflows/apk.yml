name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Proyecto y código
        run: |
          set -euo pipefail
          flutter create --org com.ccheker --project-name ccheker_live --platforms android ccheker_live
          cd ccheker_live
          flutter pub add flutter_riverpod shared_preferences local_auth path_provider share_plus crypto

          cat > lib/theme.dart <<'DART'
          import 'package:flutter/material.dart';

          class AppColors {
            static const bg = Color(0xFF0A0B0F);
            static const bgElevated = Color(0xFF12141A);
            static const glassStroke = Color(0xFF23262F);
            static const glassStrokeHi = Color(0xFF33384A);
            static const textHi = Color(0xFFF2F4F8);
            static const textMid = Color(0xFFA7AEBC);
            static const textLo = Color(0xFF6B7280);
            static const lime = Color(0xFFB8FF3C);
            static const cyan = Color(0xFF3CE0FF);
            static const violet = Color(0xFF9D7CFF);
            static const magenta = Color(0xFFFF5CC8);
            static const amber = Color(0xFFFFC53C);
            static const red = Color(0xFFFF5C5C);
            static const tierGold = Color(0xFFE8C24A);
            static const tierSilver = Color(0xFFC7CDD8);
            static const tierBronze = Color(0xFFC58A5A);
            static const gradientGlass = LinearGradient(
              colors: [Color(0x14FFFFFF), Color(0x06FFFFFF)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            );
          }

          class AppTextStyles {
            static const h2 = TextStyle(fontSize: 20, fontWeight: FontWeight.w800, color: AppColors.textHi);
            static const body = TextStyle(fontSize: 14, color: AppColors.textHi);
            static const caption = TextStyle(fontSize: 12, color: AppColors.textMid);
            static const mono = TextStyle(
              fontSize: 14,
              color: AppColors.textHi,
              fontFamily: 'monospace',
              letterSpacing: 0.6,
            );
          }

          class AppTheme {
            static ThemeData dark() => ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: AppColors.bg,
                  colorScheme: const ColorScheme.dark(
                    primary: AppColors.lime,
                    surface: AppColors.bgElevated,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: AppColors.bg,
                    elevation: 0,
                    centerTitle: false,
                    scrolledUnderElevation: 0,
                  ),
                  dividerColor: AppColors.glassStroke,
                  splashColor: Colors.transparent,
                  highlightColor: Colors.transparent,
                );
          }
          DART

          cat > lib/widgets.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'theme.dart';

          class GlassPanel extends StatelessWidget {
            const GlassPanel({super.key, required this.child, this.onTap, this.padding});
            final Widget child;
            final VoidCallback? onTap;
            final EdgeInsets? padding;

            @override
            Widget build(BuildContext context) {
              final box = Container(
                width: double.infinity,
                padding: padding ?? const EdgeInsets.all(14),
                decoration: BoxDecoration(
                  color: AppColors.bgElevated,
                  gradient: AppColors.gradientGlass,
                  borderRadius: BorderRadius.circular(16),
                  border: Border.all(color: AppColors.glassStroke),
                ),
                child: child,
              );
              if (onTap == null) return box;
              return GestureDetector(onTap: onTap, behavior: HitTestBehavior.opaque, child: box);
            }
          }

          class NeonButton extends StatelessWidget {
            const NeonButton({
              super.key,
              required this.label,
              required this.onPressed,
              this.icon,
              this.color = AppColors.lime,
            });
            final String label;
            final VoidCallback? onPressed;
            final IconData? icon;
            final Color color;

            @override
            Widget build(BuildContext context) {
              return Opacity(
                opacity: onPressed == null ? 0.4 : 1,
                child: GestureDetector(
                  onTap: onPressed,
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                    decoration: BoxDecoration(
                      color: color.withOpacity(0.13),
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: color.withOpacity(0.5)),
                      boxShadow: [
                        BoxShadow(color: color.withOpacity(0.15), blurRadius: 14, spreadRadius: -3),
                      ],
                    ),
                    child: Row(mainAxisSize: MainAxisSize.min, children: [
                      if (icon != null) ...[
                        Icon(icon, size: 16, color: color),
                        const SizedBox(width: 8),
                      ],
                      Text(
                        label,
                        style: TextStyle(color: color, fontSize: 13, fontWeight: FontWeight.w700),
