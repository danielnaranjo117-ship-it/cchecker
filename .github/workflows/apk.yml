          class ProxyRelay {
            static final Map<String, int> ports = {};

            static Future<int> port(ProxyNode p) async {
              final cached = ports[p.id];
              if (cached != null) return cached;
              final srv = await ServerSocket.bind(InternetAddress.loopbackIPv4, 0);
              ports[p.id] = srv.port;
              srv.listen((c) => _session(c, p), onError: (Object _) {});
              return srv.port;
            }

            static Future<void> _session(Socket client, ProxyNode p) async {
              final a = _Chan(client);
              _Chan? b;
              try {
                final first = await a.line();
                final parts = first.split(' ');
                final isConnect = parts.isNotEmpty && parts.first.toUpperCase() == 'CONNECT';
                String host;
                int port;
                if (isConnect) {
                  final target = parts[1];
                  final i = target.lastIndexOf(':');
                  host = target.substring(0, i);
                  port = int.parse(target.substring(i + 1));
                  await a.untilBlank();
                } else {
                  final u = Uri.parse(parts[1]);
                  host = u.host;
                  port = u.hasPort ? u.port : 80;
                }
                final up = await Socket.connect(p.host, p.port, timeout: const Duration(seconds: 15));
                up.setOption(SocketOption.tcpNoDelay, true);
                b = _Chan(up);
                if (p.kind == ProxyKind.socks5) {
                  await _socks5(b, p, host, port);
                } else {
                  await _httpConnect(b, p, host, port);
                }
                if (isConnect) {
                  a.write(utf8.encode('HTTP/1.1 200 Connection established\r\n\r\n'));
                } else {
                  b.write(utf8.encode('$first\r\n'));
                }
                _pump(a, b);
                _pump(b, a);
              } catch (_) {
                a.close();
                b?.close();
              }
            }

            static void _pump(_Chan from, _Chan to) {
              () async {
                try {
                  while (true) {
                    final d = await from.some();
                    if (d.isEmpty) break;
                    to.write(d);
                  }
                } catch (_) {}
                to.close();
              }();
            }

            static Future<void> _socks5(_Chan c, ProxyNode p, String host, int port) async {
              final auth = p.user.isNotEmpty;
              c.write([5, auth ? 2 : 1, 0, auth ? 2 : 0]);
              final hello = await c.read(2);
              if (hello[0] != 5) throw 'socks versión';
              if (hello[1] == 0xFF) throw 'socks sin método';
              if (hello[1] == 2) {
                final u = utf8.encode(p.user);
                final pw = utf8.encode(p.pass);
                c.write([1, u.length, ...u, pw.length, ...pw]);
                final ar = await c.read(2);
                if (ar[1] != 0) throw 'socks auth';
              }
              final hb = utf8.encode(host);
              c.write([5, 1, 0, 3, hb.length, ...hb, (port >> 8) & 255, port & 255]);
              final rep = await c.read(4);
              if (rep[1] != 0) throw 'socks connect ${rep[1]}';
              if (rep[3] == 1) {
                await c.read(6);
              } else if (rep[3] == 4) {
                await c.read(18);
              } else if (rep[3] == 3) {
                final l = await c.read(1);
                await c.read(l[0] + 2);
              }
            }

            static Future<void> _httpConnect(_Chan c, ProxyNode p, String host, int port) async {
              final b = StringBuffer();
              b.write('CONNECT $host:$port HTTP/1.1\r\n');
              b.write('Host: $host:$port\r\n');
              if (p.user.isNotEmpty) {
                b.write('Proxy-Authorization: Basic ${base64Encode(utf8.encode('${p.user}:${p.pass}'))}\r\n');
              }
              b.write('Proxy-Connection: keep-alive\r\n\r\n');
              c.write(utf8.encode(b.toString()));
              final l = await c.line();
              final parts = l.split(' ');
              final code = parts.length > 1 ? (int.tryParse(parts[1]) ?? 0) : 0;
              if (code != 200) throw 'proxy $code';
              await c.untilBlank();
            }
          }

