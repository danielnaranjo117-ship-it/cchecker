          cat > lib/net.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';

          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:http/http.dart' as http;

          import 'core.dart';

          class NetSense {
            NetSense._();
            static final NetSense i = NetSense._();

            bool online = true;
            bool wifi = true;
            int latencyMs = 0;
            int concurrency = 6;
            bool autoTune = true;

            final _ctrl = StreamController<void>.broadcast();
            Stream<void> get changes => _ctrl.stream;

            StreamSubscription? _sub;
            Timer? _beat;

            void start() {
              _sub = Connectivity().onConnectivityChanged.listen(_apply);
              Connectivity().checkConnectivity().then(_apply);
              _beat ??= Timer.periodic(const Duration(seconds: 20), (_) => ping());
            }

            void stop() {
              _sub?.cancel();
              _beat?.cancel();
              _beat = null;
            }

            void _apply(List<ConnectivityResult> res) {
              final wasOnline = online;
              online = res.isNotEmpty && !res.contains(ConnectivityResult.none);
              wifi = res.contains(ConnectivityResult.wifi) || res.contains(ConnectivityResult.ethernet);
              if (wasOnline != online) _ctrl.add(null);
              _tune();
            }

            Future<void> ping() async {
              final sw = Stopwatch()..start();
              try {
                final r = await http.get(Uri.parse(defaultProbe)).timeout(const Duration(seconds: 8));
                latencyMs = sw.elapsedMilliseconds;
                online = r.statusCode < 500;
              } catch (_) {
                latencyMs = 0;
                online = false;
              }
              _tune();
              _ctrl.add(null);
            }

            void _tune() {
              if (!autoTune) return;
              concurrency = !online
                  ? 2
                  : latencyMs == 0
                      ? 4
                      : latencyMs < 300
                          ? 8
                          : latencyMs < 900
                              ? 4
                              : 2;
              _ctrl.add(null);
            }

            int backoff(int attempt) => min(8000, 300 * pow(2, attempt).toInt());

            static const dohEndpoints = [
              'https://cloudflare-dns.com/dns-query',
              'https://dns.google/resolve',
            ];

            Future<List<String>> resolve(String host) async {
              for (final ep in dohEndpoints) {
                try {
                  final uri = Uri.parse(ep).replace(queryParameters: {'name': host, 'type': 'A'});
                  final r = await http
                      .get(uri, headers: const {'accept': 'application/dns-json'})
                      .timeout(const Duration(seconds: 6));
                  if (r.statusCode != 200) continue;
                  final j = jsonDecode(r.body) as Map<String, dynamic>;
                  final ans = (j['Answer'] as List?) ?? const [];
                  final ips = ans
                      .where((a) => (a as Map)['type'] == 1)
                      .map((a) => (a as Map)['data'] as String)
                      .where((ip) => InternetAddress.tryParse(ip) != null)
                      .toList();
                  if (ips.isNotEmpty) return ips;
                } catch (_) {}
              }
              return const [];
            }
          }
          DART

          cat > lib/models.dart <<'DART'
          import 'core.dart';

          enum CheckStatus { unchecked, checking, live, dead, unknown }

          extension CheckStatusX on CheckStatus {
            String get label => switch (this) {
                  CheckStatus.unchecked => 'sin revisar',
                  CheckStatus.checking => 'revisando',
                  CheckStatus.live => 'viva',
                  CheckStatus.dead => 'muerta',
                  CheckStatus.unknown => 'incierta',
                };
          }

          class CreditCard {
            CreditCard({
              required this.id,
              required this.pan,
              required this.expMonth,
              required this.expYear,
              required this.cvv,
              this.brand = '',
              this.bank = '',
              this.country = '',
              this.cardType = '',
              this.level = '',
              this.status = CheckStatus.unchecked,
              this.message = '',
              this.gateway = '',
              this.latencyMs = 0,
              this.checkedAt,
              this.bin = '',
            });

            final String id;
            final String pan;
            final int expMonth;
            final int expYear;
            final String cvv;
            final String brand;
            final String bank;
            final String country;
            final String cardType;
            final String level;
            final CheckStatus status;
            final String message;
            final String gateway;
            final int latencyMs;
            final DateTime? checkedAt;
            final String bin;

            bool get expired => isExpired(expMonth, expYear);
            String get expLabel => '${expMonth.toString().padLeft(2, '0')}/${expYear.toString().padLeft(2, '0')}';
            String get line => '$pan|${expMonth.toString().padLeft(2, '0')}|${expYear.toString().padLeft(2, '0')}|$cvv';

            CreditCard copyWith({
              String? pan,
              int? expMonth,
              int? expYear,
              String? cvv,
              String? brand,
              String? bank,
              String? country,
              String? cardType,
              String? level,
              CheckStatus? status,
              String? message,
              String? gateway,
              int? latencyMs,
              DateTime? checkedAt,
              String? bin,
            }) =>
                CreditCard(
                  id: id,
                  pan: pan ?? this.pan,
                  expMonth: expMonth ?? this.expMonth,
                  expYear: expYear ?? this.expYear,
                  cvv: cvv ?? this.cvv,
                  brand: brand ?? this.brand,
                  bank: bank ?? this.bank,
                  country: country ?? this.country,
                  cardType: cardType ?? this.cardType,
                  level: level ?? this.level,
                  status: status ?? this.status,
                  message: message ?? this.message,
                  gateway: gateway ?? this.gateway,
                  latencyMs: latencyMs ?? this.latencyMs,
                  checkedAt: checkedAt ?? this.checkedAt,
                  bin: bin ?? this.bin,
                );

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'pan': pan,
                  'm': expMonth,
                  'y': expYear,
                  'cvv': cvv,
                  'brand': brand,
                  'bank': bank,
                  'country': country,
                  'type': cardType,
                  'level': level,
                  'status': status.name,
                  'msg': message,
                  'gw': gateway,
                  'ms': latencyMs,
                  'at': checkedAt?.toIso8601String(),
                  'bin': bin,
                };

            static CreditCard fromJson(Map<String, dynamic> j) => CreditCard(
                  id: j['id'] as String,
                  pan: j['pan'] as String,
                  expMonth: j['m'] as int,
                  expYear: j['y'] as int,
                  cvv: (j['cvv'] ?? '').toString(),
                  brand: (j['brand'] ?? '').toString(),
                  bank: (j['bank'] ?? '').toString(),
                  country: (j['country'] ?? '').toString(),
                  cardType: (j['type'] ?? '').toString(),
                  level: (j['level'] ?? '').toString(),
                  status: CheckStatus.values.firstWhere((s) => s.name == j['status'], orElse: () => CheckStatus.unchecked),
                  message: (j['msg'] ?? '').toString(),
                  gateway: (j['gw'] ?? '').toString(),
                  latencyMs: (j['ms'] ?? 0) as int,
                  checkedAt: j['at'] == null ? null : DateTime.tryParse(j['at'] as String),
                  bin: (j['bin'] ?? '').toString(),
                );
          }

          class BinInfo {
            const BinInfo({this.bank = '', this.country = '', this.cardType = '', this.level = ''});
            final String bank;
            final String country;
            final String cardType;
            final String level;

            Map<String, dynamic> toJson() => {'b': bank, 'c': country, 't': cardType, 'l': level};

            static BinInfo fromJson(Map<String, dynamic> j) => BinInfo(
                  bank: (j['b'] ?? '').toString(),
                  country: (j['c'] ?? '').toString(),
                  cardType: (j['t'] ?? '').toString(),
                  level: (j['l'] ?? '').toString(),
                );
          }

          enum ProxyKind { http, socks5 }

          enum ProxyHealth { unknown, up, down }

          class ProxyNode {
            ProxyNode({
              required this.id,
              required this.host,
              required this.port,
              this.user = '',
              this.pass = '',
              this.kind = ProxyKind.http,
              this.health = ProxyHealth.unknown,
              this.latencyMs = 0,
            });

            final String id;
            final String host;
            final int port;
            final String user;
            final String pass;
            final ProxyKind kind;
            ProxyHealth health;
            int latencyMs;

            String get label => '$host:$port';

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'host': host,
                  'port': port,
                  'u': user,
                  'p': pass,
                  'k': kind.name,
                  'h': health.name,
                  'ms': latencyMs,
                };

            static ProxyNode fromJson(Map<String, dynamic> j) => ProxyNode(
                  id: j['id'] as String,
                  host: j['host'] as String,
                  port: j['port'] as int,
                  user: (j['u'] ?? '').toString(),
                  pass: (j['p'] ?? '').toString(),
                  kind: ProxyKind.values.firstWhere((k) => k.name == j['k'], orElse: () => ProxyKind.http),
                  health: ProxyHealth.values.firstWhere((h) => h.name == j['h'], orElse: () => ProxyHealth.unknown),
                  latencyMs: (j['ms'] ?? 0) as int,
                );
          }

          class ImportResult {
            ImportResult({required this.cards, this.duplicates = 0, this.junk = 0, this.fixed = 0, this.expired = 0});
            final List<CreditCard> cards;
