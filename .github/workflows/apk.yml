          class _VaultScreenState extends ConsumerState<VaultScreen> {
            final _q = TextEditingController();
            CheckStatus? _status;
            String _bin = '';
            final _brands = <String>{};
            final _countries = <String>{};
            final _levels = <String>{};
            int _sort = 0;
            bool _asc = false;

            static const _sortNames = ['recientes', 'banco', 'estado', 'PAN'];

            @override
            void dispose() {
              _q.dispose();
              super.dispose();
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            int get _active =>
                _brands.length + _countries.length + _levels.length + (_status == null ? 0 : 1) + (_bin.isEmpty ? 0 : 1);

            List<CreditCard> _apply(List<CreditCard> all) {
              final q = _q.text.trim().toLowerCase();
              final list = all.where((c) {
                if (_status != null && c.status != _status) return false;
                if (_bin.isNotEmpty && !c.pan.startsWith(_bin)) return false;
                if (_brands.isNotEmpty && !_brands.contains(c.brand)) return false;
                if (_countries.isNotEmpty && !_countries.contains(c.country)) return false;
                if (_levels.isNotEmpty && !_levels.contains(c.level)) return false;
                if (q.isEmpty) return true;
                return c.pan.contains(q) ||
                    c.bank.toLowerCase().contains(q) ||
                    c.brand.toLowerCase().contains(q) ||
                    c.country.toLowerCase().contains(q) ||
                    c.level.toLowerCase().contains(q) ||
                    c.expLabel.contains(q) ||
                    c.cvv.contains(q);
              }).toList();
              int cmp(CreditCard a, CreditCard b) {
                switch (_sort) {
                  case 1:
                    return a.bank.toLowerCase().compareTo(b.bank.toLowerCase());
                  case 2:
                    return a.status.index.compareTo(b.status.index);
                  case 3:
                    return a.pan.compareTo(b.pan);
                  default:
                    return a.addedAt.compareTo(b.addedAt);
                }
              }

              list.sort((a, b) => _asc ? cmp(a, b) : cmp(b, a));
              return list;
            }

            void _reset() {
              setState(() {
                _status = null;
                _bin = '';
