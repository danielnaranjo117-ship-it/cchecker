          class ProxyPool {
            ProxyPool(this.cfg, List<ProxyNode> nodes) : _nodes = List.of(nodes);
            final AppSettings cfg;
            final List<ProxyNode> _nodes;
            final Map<String, int> _use = {};
            int _rr = 0;

            int get size => _nodes.length;

            List<ProxyNode> _alive() {
              final now = DateTime.now();
              final out = <ProxyNode>[];
              for (final p in _nodes) {
                if (p.cooldownUntil != null) {
                  if (p.cooldownUntil!.isAfter(now)) continue;
                  p.cooldownUntil = null;
                  p.health = ProxyHealth.unknown;
                  p.streak = 0;
                  out.add(p);
                } else if (p.health != ProxyHealth.down) {
                  out.add(p);
                }
              }
              return out;
            }

            ProxyNode? next() {
              final a = _alive();
              if (a.isEmpty) return null;
              switch (cfg.rotation) {
                case 'rapido':
                  a.sort((x, y) => x.avgMs.compareTo(y.avgMs));
                  return a.first;
                case 'mejor':
                  a.sort((x, y) => y.score.compareTo(x.score));
                  return a.first;
                case 'menos':
                  a.sort((x, y) => (_use[x.id] ?? 0).compareTo(_use[y.id] ?? 0));
                  final p = a.first;
                  _use[p.id] = (_use[p.id] ?? 0) + 1;
                  return p;
                default:
                  final p = a[_rr % a.length];
                  _rr++;
                  return p;
              }
            }

            void report(ProxyNode p, CheckOutcome o) {
              p.lastUsed = DateTime.now();
              if (o.error) {
                p.fail++;
                p.streak++;
                if (p.streak >= cfg.banAfter) {
                  p.health = ProxyHealth.down;
                  p.cooldownUntil = DateTime.now().add(const Duration(seconds: 120));
                }
              } else {
                p.ok++;
                p.totalMs += o.ms;
                p.streak = 0;
                p.health = ProxyHealth.up;
                p.cooldownUntil = null;
              }
            }
          }
