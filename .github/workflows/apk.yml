              if (i >= 0) {
                Vault.i.proxies[i] = n;
              } else {
                Vault.i.proxies.add(n);
              }
              await Vault.i.save();
            }

            Future<void> remove(String id) async {
              Vault.i.proxies.removeWhere((p) => p.id == id);
              await Vault.i.save();
            }

            Future<void> persist(List<ProxyNode> list) async {
              Vault.i.proxies
                ..clear()
                ..addAll(list);
              await Vault.i.save();
            }
          }
