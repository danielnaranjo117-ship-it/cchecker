            }

            Future<void> untilBlank() async {
              var n = 0;
              while (true) {
                final c = await byte();
                if (c == 10) {
                  n++;
                  if (n == 2) break;
                } else if (c != 13) {
                  n = 0;
                }
              }
            }

            Future<List<int>> some() async {
              while (_buf.isEmpty && !_done) {
                await _wait();
              }
              final out = List<int>.from(_buf);
              _buf.clear();
              return out;
            }

            void write(List<int> d) {
              _s.add(d);
              _s.flush();
            }

