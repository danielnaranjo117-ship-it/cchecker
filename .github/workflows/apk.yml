          import 'dart:convert';
          import 'dart:math';

          import 'package:crypto/crypto.dart';
          import 'package:encrypt/encrypt.dart' as enc;
          import 'package:shared_preferences/shared_preferences.dart';

          class Vault {
            Vault._();
            static final Vault i = Vault._();

            SharedPreferences? _sp;
            Map<String, dynamic> data = {};
            bool _unlocked = false;
            String _pass = '';

            bool get hasPassword => (_sp?.getString('vault_hash') ?? '').isNotEmpty;
            bool get unlocked => _unlocked;

            Future<void> boot() async {
              _sp = await SharedPreferences.getInstance();
              data = {};
              _unlocked = !hasPassword;
              if (_unlocked) await _load();
            }

            Future<bool> unlock(String pass) async {
              if (!hasPassword) {
                _unlocked = true;
                await _load();
                return true;
              }
              if (hashPass(pass) != _sp!.getString('vault_hash')) return false;
              _pass = pass;
              _unlocked = true;
              await _load();
              return true;
            }

            void lock() {
              _unlocked = false;
              data = {};
              _pass = '';
            }

            Future<void> setPassword(String pass) async {
              if (pass.isEmpty) {
                await _sp!.remove('vault_hash');
                await _sp!.remove('vault_blob');
                await _sp!.remove('vault_salt');
                _pass = '';
                _unlocked = true;
                await save();
                return;
              }

              final salt = _sp!.getString('vault_salt') ?? _rand(16);
              await _sp!.setString('vault_salt', salt);
              await _sp!.setString('vault_hash', _hash(pass, salt));
              _pass = pass;
              _unlocked = true;
              await save();
            }

            String hashPass(String pass) => _hash(pass, _sp?.getString('vault_salt') ?? '');

            String _hash(String pass, String salt) =>
                sha256.convert(utf8.encode('$salt|$pass|ccheker')).toString();

            String _rand(int n) {
              final r = Random.secure();
              return List.generate(n, (_) => r.nextInt(256).toRadixString(16).padLeft(2, '0')).join();
            }

            Future<void> _load() async {
              final blob = _sp!.getString('vault_blob');
              if (blob == null || blob.isEmpty) {
                data = {};
                return;
              }
              try {
                data = jsonDecode(_pass.isEmpty ? blob : _decrypt(blob)) as Map<String, dynamic>;
              } catch (_) {
                data = {};
              }
            }

            Future<void> save() async {
              if (!_unlocked) return;
              final txt = jsonEncode(data);
              await _sp!.setString('vault_blob', _pass.isEmpty ? txt : _encrypt(txt));
            }

            String _key() => _hash(_pass, _sp!.getString('vault_salt') ?? '').substring(0, 32);

            String _encrypt(String txt) {
              final key = enc.Key.fromUtf8(_key());
              final iv = enc.IV.fromSecureRandom(16);
              final e = enc.Encrypter(enc.AES(key, mode: enc.AESMode.cbc));
              return '${iv.base64}:${e.encrypt(txt, iv: iv).base64}';
            }

            String _decrypt(String blob) {
              final parts = blob.split(':');
              if (parts.length != 2) return blob;
              final key = enc.Key.fromUtf8(_key());
              final e = enc.Encrypter(enc.AES(key, mode: enc.AESMode.cbc));
              return e.decrypt64(parts[1], iv: enc.IV.fromBase64(parts[0]));
            }
          }
