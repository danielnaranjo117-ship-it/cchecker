      - name: Android
        run: |
          set -euo pipefail
          cd ccheker_live
          python3 - <<'PY'
          import glob, os, re

          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          s = s.replace('android:label="ccheker_live"', 'android:label="CCheker"')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          open(m, 'w', encoding='utf-8').write(s)

          for p in glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True):
              k = open(p, encoding='utf-8').read()
              k = k.replace('FlutterActivity', 'FlutterFragmentActivity')
              open(p, 'w', encoding='utf-8').write(k)

          for g in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(g):
                  b = open(g, encoding='utf-8').read()
                  b = b.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  b = b.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                  open(g, 'w', encoding='utf-8').write(b)
          PY

