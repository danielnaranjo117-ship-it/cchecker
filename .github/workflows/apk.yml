            @override
            void initState() {
              super.initState();
              _skey = TextEditingController(text: ref.read(settingsProvider).stripeKey);
              _dkey = TextEditingController(text: ref.read(settingsProvider).dorkillKey);
              _probe = TextEditingController(text: ref.read(settingsProvider).probeUrl);
              _pass = TextEditingController();
              _boot();
            }

            Future<void> _boot() async {
              if (await BinDb.i.installed()) {
                ref.read(binStatusProvider.notifier).state =
                    BinStatus(installed: true, count: BinDb.i.count, note: 'archivo listo');
              }
            }

            @override
            void dispose() {
              _skey.dispose();
              _dkey.dispose();
              _probe.dispose();
              _pass.dispose();
              super.dispose();
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> _download() async {
              final st = ref.read(binStatusProvider.notifier);
              st.state = const BinStatus(busy: true, note: 'descargando 0 MB');

              try {
                await BinDb.i.download(onProgress: (b, t) {
                  st.state = st.state.copyWith(
                    note: 'descargando ${(b / 1048576).toStringAsFixed(1)}/${(t / 1048576).toStringAsFixed(1)} MB',
                  );
                });
                st.state = st.state.copyWith(note: 'indexando');
                final n = await BinDb.i.buildIndex();
                await ref.read(settingsProvider.notifier).setOfflineDb(true);
                st.state = BinStatus(installed: true, count: n, note: 'lista');
                _snack('Base lista: ${fmtInt(n)} BINs');
              } catch (_) {
                st.state = const BinStatus(note: 'error en la descarga');
                _snack('Fallo la descarga');
              }
            }

            Future<void> _drop() async {
              await BinDb.i.drop();
              await ref.read(settingsProvider.notifier).setOfflineDb(false);
              ref.read(binStatusProvider.notifier).state = const BinStatus(note: 'borrada');
              _snack('Base offline borrada');
            }

            @override
            Widget build(BuildContext context) {
              final s = ref.watch(settingsProvider);
              final n = ref.read(settingsProvider.notifier);
              final bin = ref.watch(binStatusProvider);

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Motor de validacion'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Wrap(
                          spacing: 8,
                          runSpacing: 8,
                          children: [
                            _chip('Stripe', 'stripe', s.engine, n.setEngine),
                            _chip('Dorkill', 'dorkill', s.engine, n.setEngine),
                            _chip('Cascada', 'both', s.engine, n.setEngine),
                          ],
                        ),
                        const SizedBox(height: 8),
                        Text(
                          s.engine == 'stripe'
                              ? 'Stripe: valida formato, vencimiento y CVV. Es el mas rapido.'
                              : s.engine == 'dorkill'
                                  ? 'Dorkill: necesita una API key gratis.'
                                  : 'Cascada: cruza los dos. Viva solo si uno acepta; nunca marca muerta si hubo error de red.',
                          style: AppTextStyles.caption,
                        ),
                        if (s.engine != 'dorkill') ...[
                          const SizedBox(height: 12),
                          TextField(
                            controller: _skey,
                            style: AppTextStyles.mono,
                            onSubmitted: n.setStripeKey,
                            decoration: const InputDecoration(
                              labelText: 'Stripe publishable key',
                              labelStyle: AppTextStyles.caption,
                            ),
                          ),
                        ],
                        if (s.engine != 'stripe') ...[
                          const SizedBox(height: 12),
                          TextField(
                            controller: _dkey,
                            style: AppTextStyles.mono,
                            onSubmitted: n.setDorkillKey,
                            decoration: const InputDecoration(
                              labelText: 'API key de Dorkill',
                              labelStyle: AppTextStyles.caption,
                            ),
                          ),
                        ],
                        const SizedBox(height: 12),
                        Text('Reintentos: ${s.retries}', style: AppTextStyles.body),
                        Slider(
                          value: s.retries.toDouble(),
                          min: 0,
                          max: 3,
                          divisions: 3,
                          onChanged: (v) => n.setRetries(v.round()),
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Usar proxies', style: AppTextStyles.body),
                          value: s.useProxies,
                          activeColor: AppColors.lime,
                          onChanged: n.setUseProxies,
                        ),
                      ],
                    ),
                  ),
                  const SectionHeader('Base offline de BINs'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          bin.installed
                              ? 'Instalada · ${fmtInt(bin.count)} BINs indexados'
                              : 'Cientos de miles de BINs. Sin esto cada consulta depende de internet.',
                          style: AppTextStyles.body,
                        ),
                        if (bin.note.isNotEmpty) ...[
                          const SizedBox(height: 4),
                          Text(bin.note, style: AppTextStyles.caption),
                        ],
                        const SizedBox(height: 12),
                        Wrap(
                          spacing: 10,
                          runSpacing: 10,
                          children: [
                            NeonButton(
                              label: bin.busy ? 'trabajando' : 'Descargar y activar',
                              icon: Icons.cloud_download_outlined,
                              onPressed: bin.busy
                                  ? null
                                  : () async {
                                      if (ref.read(settingsProvider).wifiOnly && !NetSense.i.wifi) {
                                        _snack('Estas en datos moviles, arranco igual');
                                      }
                                      await _download();
                                    },
                            ),
                            if (bin.installed)
                              NeonButton(label: 'Borrar', icon: Icons.delete_outline, color: AppColors.red, onPressed: bin.busy ? null : _drop),
                          ],
                        ),
                      ],
                    ),
                  ),
                  const SectionHeader('Red (Venezuela)'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Consumer(builder: (_, ref, __) {
                          final net = ref.watch(netProvider);
                          return Row(
                            children: [
                              Icon(net.online ? Icons.wifi : Icons.wifi_off, size: 16, color: net.online ? AppColors.lime : AppColors.red),
                              const SizedBox(width: 8),
                              Text(
                                net.online ? (net.wifi ? 'conectado por wifi' : 'conectado por datos moviles') : 'sin conexion',
                                style: AppTextStyles.body,
                              ),
                            ],
                          );
                        }),
                        const SizedBox(height: 4),
                        Consumer(builder: (_, ref, __) {
                          final net = ref.watch(netProvider);
                          return Text('latencia ${net.latencyMs}ms · concurrencia ${net.concurrency}', style: AppTextStyles.caption);
                        }),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Ajuste automatico', style: AppTextStyles.body),
                          subtitle: const Text('Baja la concurrencia sola si la red falla', style: AppTextStyles.caption),
                          value: s.autoTune,
                          activeColor: AppColors.lime,
                          onChanged: n.setAutoTune,
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('DNS por HTTPS', style: AppTextStyles.body),
                          subtitle: const Text('Esquiva el DNS secuestrado del operador', style: AppTextStyles.caption),
                          value: s.doh,
                          activeColor: AppColors.cyan,
                          onChanged: n.setDoh,
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Proxy fijo por corrida', style: AppTextStyles.body),
                          subtitle: const Text('Apagado: rota la IP en cada intento', style: AppTextStyles.caption),
                          value: s.proxySticky,
                          activeColor: AppColors.violet,
                          onChanged: n.setProxySticky,
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Descargar solo por wifi', style: AppTextStyles.body),
                          value: s.wifiOnly,
                          activeColor: AppColors.cyan,
                          onChanged: n.setWifiOnly,
                        ),
                        const SizedBox(height: 8),
                        NeonButton(
                          label: 'Probar red',
                          icon: Icons.speed,
                          color: AppColors.cyan,
                          onPressed: () async {
                            final engine = CheckEngine(s);
                            var ok = 0;
                            var ms = 0;
                            for (var i = 0; i < 5; i++) {
                              final r = await engine.probe(null);
                              if (r.ok) ok++;
                              ms += r.ms;
                            }
                            NetSense.i.latencyMs = ok == 0 ? 0 : ms ~/ ok;
                            _snack(ok == 0 ? 'Sin respuesta' : '$ok/5 ok · ${NetSense.i.latencyMs}ms promedio');
                          },
                        ),
                      ],
                    ),
                  ),
                  const SectionHeader('Rendimiento'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('Concurrencia: ${s.concurrency}', style: AppTextStyles.body),
                        Slider(
                          value: s.concurrency.toDouble(),
                          min: 1,
                          max: 16,
                          divisions: 15,
                          onChanged: (v) => n.setConcurrency(v.round()),
                        ),
                        Text('Timeout: ${s.timeoutSec}s', style: AppTextStyles.body),
                        Slider(
                          value: s.timeoutSec.toDouble(),
                          min: 5,
                          max: 60,
                          divisions: 11,
                          activeColor: AppColors.cyan,
                          onChanged: (v) => n.setTimeoutSec(v.round()),
                        ),
                        const SizedBox(height: 6),
                        TextField(
                          controller: _probe,
                          style: AppTextStyles.mono,
                          onSubmitted: n.setProbeUrl,
                          decoration: const InputDecoration(
                            labelText: 'URL de prueba de conectividad',
                            labelStyle: AppTextStyles.caption,
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SectionHeader('Seguridad'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          Vault.i.hasPassword ? 'Boveda protegida con contrasena' : 'Sin contrasena: se abre directo',
                          style: AppTextStyles.body,
                        ),
                        const SizedBox(height: 10),
                        TextField(
                          controller: _pass,
                          obscureText: true,
                          style: AppTextStyles.mono,
                          decoration: const InputDecoration(
                            labelText: 'Nueva contrasena (vacio = quitarla)',
                            labelStyle: AppTextStyles.caption,
                          ),
                        ),
                        const SizedBox(height: 10),
                        NeonButton(
                          label: 'Aplicar contrasena',
                          icon: Icons.lock_outline,
                          onPressed: () async {
                            await Vault.i.setPassword(_pass.text);
                            _snack(_pass.text.isEmpty ? 'Contrasena quitada' : 'Contrasena activada');
                          },
                        ),
                        const SizedBox(height: 6),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Biometria', style: AppTextStyles.body),
                          subtitle: const Text('Requiere contrasena activada', style: AppTextStyles.caption),
                          value: s.biometrics,
                          activeColor: AppColors.lime,
                          onChanged: n.setBiometrics,
                        ),
                        Text('Auto-bloqueo: ${s.autoLockMin} min', style: AppTextStyles.body),
                        Slider(
                          value: s.autoLockMin.toDouble(),
                          min: 0,
                          max: 30,
                          divisions: 6,
                          activeColor: AppColors.violet,
                          onChanged: (v) => n.setAutoLock(v.round()),
                        ),
                      ],
                    ),
                  ),
                  const SectionHeader('Zona peligrosa'),
                  GlassPanel(
                    child: Wrap(
                      spacing: 10,
                      runSpacing: 10,
                      children: [
                        NeonButton(
                          label: 'Vaciar boveda',
                          color: AppColors.red,
                          icon: Icons.delete_forever,
                          onPressed: () async {
                            await ref.read(cardsProvider.notifier).clear();
                            _snack('Boveda vaciada');
                          },
                        ),
                        NeonButton(
                          label: 'Limpiar cache de BINs',
                          color: AppColors.amber,
                          icon: Icons.cleaning_services,
                          onPressed: () async {
                            Vault.i.data['binCache'] = <String, dynamic>{};
                            await Vault.i.save();
                            _snack('Cache borrada');
                          },
                        ),
                        NeonButton(
                          label: 'Bloquear ahora',
                          color: AppColors.textMid,
                          icon: Icons.lock_outline,
                          onPressed: () {
                            Vault.i.lock();
                            ref.read(lockProvider.notifier).state = true;
                          },
                        ),
                      ],
                    ),
                  ),
                ],
              );
            }

            Widget _chip(String label, String value, String current, void Function(String) apply) {
              final on = current == value;
              return GestureDetector(
                onTap: () => apply(value),
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 8),
                  decoration: BoxDecoration(
                    color: on ? AppColors.lime.withOpacity(0.18) : AppColors.bg,
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(color: on ? AppColors.lime.withOpacity(0.6) : AppColors.glassStroke),
                  ),
                  child: Text(
                    label,
                    style: TextStyle(
                      fontSize: 12,
                      color: on ? AppColors.lime : AppColors.textMid,
                      fontWeight: FontWeight.w600,
                    ),
                  ),
                ),
              );
            }
          }
          DART

          # Android: permisos, minSdk y actividad para biometria

          MAN=android/app/src/main/AndroidManifest.xml

          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' "$MAN"

          for G in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$G" ] || continue
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$G"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$G"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$G"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' "$G"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$G"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' "$G"
          done

          KT=$(find android -name 'MainActivity.kt' | head -n1 || true)

          if [ -n "$KT" ]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$KT"
            sed -i 's/FlutterActivity()/FlutterFragmentActivity()/g' "$KT"
            sed -i 's/: FlutterActivity/: FlutterFragmentActivity/g' "$KT"
          fi

          flutter pub get

          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ccheker-live-apk
          path: ccheker_live/build/app/outputs/flutter-apk/app-release.apk
