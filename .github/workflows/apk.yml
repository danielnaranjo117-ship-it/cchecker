                }

                if (res.statusCode == 429 || res.statusCode >= 500) {
                  return CheckOutcome(
                    ok: false,
                    error: true,
                    ms: sw.elapsedMilliseconds,
                    note: 'HTTP ${res.statusCode}',
                    status: CheckStatus.unknown,
