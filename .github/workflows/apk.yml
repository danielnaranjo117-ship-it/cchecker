          List<ProxyNode> parseProxyList(String raw) {
            final out = <ProxyNode>[];
            final seen = <String>{};
            for (final line in raw.split(RegExp(r'[\r\n,;]+'))) {
              var t = line.trim();
              if (t.isEmpty) continue;
              var kind = ProxyKind.http;
              final low = t.toLowerCase();
              if (low.startsWith('socks5://')) {
                kind = ProxyKind.socks5;
                t = t.substring(9);
              } else if (low.startsWith('socks://')) {
                kind = ProxyKind.socks5;
                t = t.substring(8);
              } else if (low.startsWith('https://')) {
                kind = ProxyKind.https;
                t = t.substring(8);
              } else if (low.startsWith('http://')) {
                t = t.substring(7);
              }
              var user = '';
              var pass = '';
              if (t.contains('@')) {
                final parts = t.split('@');
                final cred = parts.removeAt(0);
                t = parts.join('@');
                final cp = cred.split(':');
                user = cp.isNotEmpty ? cp[0].trim() : '';
                pass = cp.length > 1 ? cp[1].trim() : '';
              }
              final seg = t.split(':');
              if (seg.length < 2) continue;
              final host = seg[0].trim();
              final port = int.tryParse(seg[1].trim()) ?? 0;
              if (host.isEmpty || port <= 0 || port > 65535) continue;
              if (user.isEmpty && seg.length >= 4) {
                user = seg[2].trim();
                pass = seg[3].trim();
              } else if (user.isEmpty && seg.length == 3) {
                user = seg[2].trim();
              }
              final key = '$host:$port';
              if (seen.contains(key)) continue;
              seen.add(key);
              out.add(ProxyNode(id: newId(), host: host, port: port, user: user, pass: pass, kind: kind));
            }
            return out;
          }

          class ProxiesScreen extends ConsumerStatefulWidget {
            const ProxiesScreen({super.key});
            @override
            ConsumerState<ProxiesScreen> createState() => _ProxiesScreenState();
          }

          class _ProxiesScreenState extends ConsumerState<ProxiesScreen> {
            final _host = TextEditingController();
            final _port = TextEditingController();
            final _user = TextEditingController();
            final _pass = TextEditingController();
            final _bulk = TextEditingController();
            final _q = TextEditingController();
            ProxyHealth? _filter;
            int _sort = 0;
            bool _showForm = false;
            bool _busy = false;

            static const _sortNames = ['añadidos', 'latencia', 'éxito'];

            @override
            void dispose() {
              _host.dispose();
              _port.dispose();
              _user.dispose();
              _pass.dispose();
              _bulk.dispose();
              _q.dispose();
              super.dispose();
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            List<ProxyNode> _visible(List<ProxyNode> all) {
              final q = _q.text.trim().toLowerCase();
              final list = all.where((p) {
                if (_filter == ProxyHealth.down && !p.cooling && p.health != ProxyHealth.down) return false;
                if (_filter != null && _filter != ProxyHealth.down && p.health != _filter) return false;
                if (q.isEmpty) return true;
                return p.host.toLowerCase().contains(q) || p.port.toString().contains(q);
              }).toList();
              switch (_sort) {
                case 1:
                  list.sort((a, b) => a.avgMs.compareTo(b.avgMs));
                  break;
                case 2:
                  list.sort((a, b) => b.score.compareTo(a.score));
                  break;
              }
              return list;
            }

            Future<void> _add() async {
              final host = _host.text.trim();
              final port = int.tryParse(_port.text.trim()) ?? 0;
              if (host.isEmpty || port == 0) {
                _snack('Host y puerto son obligatorios');
                return;
              }
              await ref.read(proxiesProvider.notifier).upsert(
                    ProxyNode(id: newId(), host: host, port: port, user: _user.text.trim(), pass: _pass.text.trim()),
                  );
              _host.clear();
              _port.clear();
              _user.clear();
              _pass.clear();
              _snack('Proxy agregado');
            }

            Future<void> _addBulk() async {
              final parsed = parseProxyList(_bulk.text);
              if (parsed.isEmpty) {
                _snack('No encontré proxies válidos en el texto');
                return;
              }
              final existing = ref.read(proxiesProvider).map((p) => p.label).toSet();
              final fresh = parsed.where((p) => !existing.contains(p.label)).toList();
              for (final p in fresh) {
                await ref.read(proxiesProvider.notifier).upsert(p);
              }
              _bulk.clear();
              _snack('${fresh.length} agregados · ${parsed.length - fresh.length} repetidos');
            }

            Future<void> _probeVisible() async {
              if (_busy) return;
              setState(() => _busy = true);
              final engine = CheckEngine(ref.read(settingsProvider));
              final list = _visible(ref.read(proxiesProvider));
              var cursor = 0;
              var okc = 0;
              Future<void> worker() async {
                while (true) {
                  final i = cursor;
                  if (i >= list.length) return;
                  cursor++;
                  final p = list[i];
                  final out = await engine.probe(p);
                  if (out.ok) okc++;
                  p.ok += out.ok ? 1 : 0;
                  p.fail += out.ok ? 0 : 1;
                  p.totalMs += out.ms;
                  p.latencyMs = out.ms;
                  p.streak = out.ok ? 0 : p.streak + 1;
                  p.health = out.ok ? ProxyHealth.up : ProxyHealth.down;
                }
              }

              await Future.wait(List.generate(8, (_) => worker()));
              await ref.read(proxiesProvider.notifier).save();
              ref.read(proxiesProvider.notifier).touch();
              engine.dispose();
              if (mounted) setState(() => _busy = false);
