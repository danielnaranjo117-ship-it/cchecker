            final List<int> _buf = [];
            Completer<void>? _w;
            bool _done = false;

            void _on(Uint8List d) {
              _buf.addAll(d);
              _wake();
            }

            void _finish() {
              _done = true;
              _wake();
            }

            void _wake() {
              final w = _w;
              if (w != null && !w.isCompleted) w.complete();
            }

            Future<void> _wait() async {
              _w = Completer<void>();
              await _w!.future.timeout(const Duration(seconds: 120));
