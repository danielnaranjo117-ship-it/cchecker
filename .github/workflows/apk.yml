          DART

          cat > lib/models.dart <<'DART'
          enum CheckStatus { unchecked, checking, live, noFunds, review, dead, unknown }
          enum CardTier { bronze, silver, gold, platinum }
          enum ProxyKind { http, https, socks5 }
          enum ProxyHealth { unknown, up, down }

          extension CheckStatusX on CheckStatus {
            String get label => switch (this) {
                  CheckStatus.unchecked => 'sin revisar',
                  CheckStatus.checking => 'revisando',
                  CheckStatus.live => 'viva',
                  CheckStatus.noFunds => 'sin saldo',
                  CheckStatus.review => 'revisar',
                  CheckStatus.dead => 'muerta',
                  CheckStatus.unknown => 'incierta',
                };
          }

          extension CardTierX on CardTier {
            String get label => switch (this) {
                  CardTier.platinum => 'platinum',
                  CardTier.gold => 'gold',
                  CardTier.silver => 'silver',
                  CardTier.bronze => 'base',
                };
          }

          String translateCode(String code) => switch (code) {
                'insufficient_funds' => 'sin saldo',
                'card_velocity_exceeded' => 'límite de movimientos',
                'withdrawal_count_limit_exceeded' => 'límite de extracciones',
                'incorrect_cvc' || 'invalid_cvc' => 'CVC incorrecto',
                'expired_card' => 'vencida',
                'invalid_expiry_month' || 'invalid_expiry_year' => 'vencimiento inválido',
                'incorrect_number' || 'invalid_number' => 'número inválido',
                'do_not_honor' => 'rechazada por el banco',
                'card_declined' => 'rechazada',
                'pickup_card' => 'retirada por el banco',
                'lost_card' => 'reportada perdida',
                'stolen_card' => 'reportada robada',
                'restricted_card' => 'restringida',
                'security_violation' => 'bloqueo de seguridad',
                'transaction_not_allowed' => 'operación no permitida',
                'card_not_supported' => 'tarjeta no soportada',
                'currency_not_supported' => 'moneda no soportada',
                'fraudulent' => 'marcada como fraude',
                'processing_error' => 'error de procesamiento',
                'try_again_later' => 'reintentar',
                'authentication_required' => 'requiere 3DS',
                _ => code,
              };

          class CreditCard {
            CreditCard({
              required this.id,
              required this.pan,
              this.expMonth = '',
              this.expYear = '',
              this.cvv = '',
              this.zip = '',
              this.bank = '',
              this.country = '',
              this.brand = '',
              this.level = '',
              this.countryCode = '',
              this.issuerPhone = '',
              this.issuerUrl = '',
              this.avs = '',
              this.enriched = false,
              this.tier = CardTier.bronze,
              this.status = CheckStatus.unchecked,
              this.declineCode,
              this.favorite = false,
              DateTime? addedAt,
            }) : addedAt = addedAt ?? DateTime.now();

            final String id;
            final String pan;
            final String expMonth;
            final String expYear;
            final String cvv;
            String zip;
            String bank;
            String country;
            String brand;
            String level;
            String countryCode;
            String issuerPhone;
            String issuerUrl;
            String avs;
            bool enriched;
            CardTier tier;
            CheckStatus status;
            String? declineCode;
            bool favorite;
            final DateTime addedAt;

            String get expLabel {
              if (expMonth.isEmpty) return '--/--';
              final y = expYear.length == 4 ? expYear.substring(2) : expYear;
              return '$expMonth/$y';
            }

            String get bin => pan.length >= 6 ? pan.substring(0, 6) : pan;
            String get line => '$pan|$expMonth|$expYear|$cvv';

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'pan': pan,
                  'expMonth': expMonth,
                  'expYear': expYear,
                  'cvv': cvv,
                  'zip': zip,
                  'bank': bank,
                  'country': country,
                  'brand': brand,
                  'level': level,
                  'countryCode': countryCode,
                  'issuerPhone': issuerPhone,
                  'issuerUrl': issuerUrl,
                  'avs': avs,
                  'enriched': enriched,
                  'tier': tier.name,
                  'status': status.name,
                  'declineCode': declineCode,
                  'favorite': favorite,
                  'addedAt': addedAt.toIso8601String(),
                };

            factory CreditCard.fromJson(Map<String, dynamic> j) => CreditCard(
                  id: j['id'] as String,
                  pan: j['pan'] as String,
                  expMonth: j['expMonth'] as String? ?? '',
                  expYear: j['expYear'] as String? ?? '',
                  cvv: j['cvv'] as String? ?? '',
                  zip: j['zip'] as String? ?? '',
                  bank: j['bank'] as String? ?? '',
                  country: j['country'] as String? ?? '',
                  brand: j['brand'] as String? ?? '',
                  level: j['level'] as String? ?? '',
                  countryCode: j['countryCode'] as String? ?? '',
                  issuerPhone: j['issuerPhone'] as String? ?? '',
                  issuerUrl: j['issuerUrl'] as String? ?? '',
                  avs: j['avs'] as String? ?? '',
                  enriched: j['enriched'] as bool? ?? false,
                  tier: CardTier.values.firstWhere((t) => t.name == j['tier'], orElse: () => CardTier.bronze),
                  status: CheckStatus.values.firstWhere((s) => s.name == j['status'], orElse: () => CheckStatus.unchecked),
                  declineCode: j['declineCode'] as String?,
                  favorite: j['favorite'] as bool? ?? false,
                  addedAt: DateTime.tryParse(j['addedAt'] as String? ?? '') ?? DateTime.now(),
                );
          }

          class ProxyNode {
            ProxyNode({
              required this.id,
              required this.host,
              required this.port,
              this.user = '',
              this.pass = '',
              this.kind = ProxyKind.http,
              this.health = ProxyHealth.unknown,
              this.latencyMs = 0,
              this.ok = 0,
              this.fail = 0,
              this.totalMs = 0,
              this.streak = 0,
              this.cooldownUntil,
              this.lastUsed,
            });

            final String id;
            final String host;
            final int port;
            final String user;
            final String pass;
            final ProxyKind kind;
            ProxyHealth health;
            int latencyMs;
            int ok;
            int fail;
            int totalMs;
            int streak;
            DateTime? cooldownUntil;
            DateTime? lastUsed;

            String get label => '$host:$port';
            String get auth => user.isEmpty ? label : '$host:$port:$user:$pass';
            bool get cooling => cooldownUntil != null && cooldownUntil!.isAfter(DateTime.now());
            int get avgMs => ok == 0 ? latencyMs : (totalMs / ok).round();
            double get score {
              final n = ok + fail;
              return n == 0 ? 0.5 : ok / n;
            }

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'host': host,
                  'port': port,
                  'user': user,
                  'pass': pass,
                  'kind': kind.name,
                  'health': health.name,
                  'latencyMs': latencyMs,
                  'ok': ok,
                  'fail': fail,
                  'totalMs': totalMs,
                  'streak': streak,
                  'cooldownUntil': cooldownUntil?.toIso8601String(),
                  'lastUsed': lastUsed?.toIso8601String(),
                };

            factory ProxyNode.fromJson(Map<String, dynamic> j) => ProxyNode(
                  id: j['id'] as String,
                  host: j['host'] as String,
                  port: (j['port'] as num).toInt(),
                  user: j['user'] as String? ?? '',
                  pass: j['pass'] as String? ?? '',
                  kind: ProxyKind.values.firstWhere((k) => k.name == j['kind'], orElse: () => ProxyKind.http),
                  health: ProxyHealth.values.firstWhere((h) => h.name == j['health'], orElse: () => ProxyHealth.unknown),
                  latencyMs: (j['latencyMs'] as num?)?.toInt() ?? 0,
                  ok: (j['ok'] as num?)?.toInt() ?? 0,
                  fail: (j['fail'] as num?)?.toInt() ?? 0,
                  totalMs: (j['totalMs'] as num?)?.toInt() ?? 0,
                  streak: (j['streak'] as num?)?.toInt() ?? 0,
                  cooldownUntil: DateTime.tryParse(j['cooldownUntil'] as String? ?? ''),
                  lastUsed: DateTime.tryParse(j['lastUsed'] as String? ?? ''),
                );
          }

          class CheckStats {
            CheckStats({
              this.done = 0,
              this.live = 0,
              this.noFunds = 0,
              this.review = 0,
              this.dead = 0,
              this.errors = 0,
            });
            final int done;
            final int live;
            final int noFunds;
            final int review;
            final int dead;
            final int errors;
            double get hitRate => done == 0 ? 0 : (live + noFunds + review + dead) / done;
            double get goodRate => done == 0 ? 0 : (live + noFunds) / done;
            CheckStats copyWith({
              int? done,
              int? live,
              int? noFunds,
              int? review,
              int? dead,
              int? errors,
            }) =>
                CheckStats(
                  done: done ?? this.done,
                  live: live ?? this.live,
                  noFunds: noFunds ?? this.noFunds,
                  review: review ?? this.review,
                  dead: dead ?? this.dead,
                  errors: errors ?? this.errors,
                );
          }

          class AppSettings {
            AppSettings({
              this.concurrency = 4,
              this.timeoutSec = 15,
              this.probeUrl = 'https://api.ipify.org/?format=json',
              this.autoLockMin = 5,
              this.biometrics = false,
              this.rotation = 'rotacion',
              this.retries = 1,
              this.banAfter = 3,
              this.autoEnrich = false,
              this.preflight = true,
              this.adaptive = true,
              this.zip = '',
              this.addr1 = '',
            });
            final int concurrency;
            final int timeoutSec;
            final String probeUrl;
            final int autoLockMin;
            final bool biometrics;
            final String rotation;
            final int retries;
            final int banAfter;
            final bool autoEnrich;
            final bool preflight;
            final bool adaptive;
            final String zip;
            final String addr1;

            AppSettings copyWith({
              int? concurrency,
              int? timeoutSec,
              String? probeUrl,
              int? autoLockMin,
              bool? biometrics,
              String? rotation,
              int? retries,
              int? banAfter,
              bool? autoEnrich,
              bool? preflight,
              bool? adaptive,
              String? zip,
              String? addr1,
            }) =>
                AppSettings(
                  concurrency: concurrency ?? this.concurrency,
                  timeoutSec: timeoutSec ?? this.timeoutSec,
                  probeUrl: probeUrl ?? this.probeUrl,
                  autoLockMin: autoLockMin ?? this.autoLockMin,
                  biometrics: biometrics ?? this.biometrics,
                  rotation: rotation ?? this.rotation,
                  retries: retries ?? this.retries,
                  banAfter: banAfter ?? this.banAfter,
                  autoEnrich: autoEnrich ?? this.autoEnrich,
                  preflight: preflight ?? this.preflight,
                  adaptive: adaptive ?? this.adaptive,
                  zip: zip ?? this.zip,
                  addr1: addr1 ?? this.addr1,
                );
          }
          DART

          cat > lib/core.dart <<'DART'
          import 'dart:convert';
          import 'dart:math';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'models.dart';

          String newId() =>
              '${DateTime.now().microsecondsSinceEpoch.toRadixString(36)}${Random().nextInt(1048576).toRadixString(36)}';

          bool luhn(String pan) {
            var sum = 0;
            var alt = false;
            for (var i = pan.length - 1; i >= 0; i--) {
              final c = pan.codeUnitAt(i) - 48;
              if (c < 0 || c > 9) return false;
              var d = c;
              if (alt) {
                d *= 2;
                if (d > 9) d -= 9;
              }
              sum += d;
              alt = !alt;
            }
            return sum % 10 == 0;
          }

          String schemeOf(String pan) {
            if (pan.isEmpty) return '';
            if (pan.startsWith('4')) return 'VISA';
            final two = pan.length >= 2 ? pan.substring(0, 2) : '';
            final four = pan.length >= 4 ? pan.substring(0, 4) : '';
            final n2 = int.tryParse(two) ?? 0;
            final n4 = int.tryParse(four) ?? 0;
            if (n2 >= 51 && n2 <= 55) return 'MASTERCARD';
            if (n4 >= 2221 && n4 <= 2720) return 'MASTERCARD';
            if (two == '34' || two == '37') return 'AMEX';
            if (two == '65' || n4 == 6011 || (n4 >= 644 && n4 <= 649)) return 'DISCOVER';
            if (n4 >= 3528 && n4 <= 3589) return 'JCB';
            if (two == '36' || two == '38' || two == '39') return 'DINERS';
            if (two == '62') return 'UNIONPAY';
            return '';
          }

          String maskPan(String pan) => pan.length < 10
              ? pan
              : '${pan.substring(0, 6)} **** ${pan.substring(pan.length - 4)}';

          String flagEmoji(String code) {
            if (code.length != 2) return '🏳️';
            final up = code.toUpperCase();
            return String.fromCharCodes(
              [0x1F1E6 + up.codeUnitAt(0) - 65, 0x1F1E6 + up.codeUnitAt(1) - 65],
            );
          }

          String fmtInt(int n) {
            final s = n.abs().toString();
            final b = StringBuffer();
            for (var i = 0; i < s.length; i++) {
              if (i > 0 && (s.length - i) % 3 == 0) b.write('.');
              b.write(s[i]);
            }
            return '${n < 0 ? '-' : ''}$b';
          }

          String fmtPct(double v) => '${(v * 100).toStringAsFixed(1)}%';

          Uint8List _pbkdf2(String pass, List<int> salt, int iter, int len) {
            final hmac = Hmac(sha256, utf8.encode(pass));
            final out = <int>[];
            var block = 1;
            while (out.length < len) {
              var u = hmac
                  .convert([...salt, (block >> 24) & 255, (block >> 16) & 255, (block >> 8) & 255, block & 255])
                  .bytes;
              final t = List<int>.from(u);
              for (var i = 1; i < iter; i++) {
                u = hmac.convert(u).bytes;
                for (var j = 0; j < t.length; j++) {
                  t[j] ^= u[j];
                }
              }
              out.addAll(t);
              block++;
            }
            return Uint8List.fromList(out.sublist(0, len));
          }

          Uint8List _stream(List<int> key, int len) {
            final out = <int>[];
            var c = 0;
            while (out.length < len) {
              out.addAll(sha256
                  .convert([...key, (c >> 24) & 255, (c >> 16) & 255, (c >> 8) & 255, c & 255])
                  .bytes);
              c++;
            }
            return Uint8List.fromList(out.sublist(0, len));
          }

          class Vault {
            Vault._();
            static final Vault i = Vault._();

            final List<CreditCard> cards = [];
            final List<ProxyNode> proxies = [];
            bool unlocked = false;
            Uint8List? _key;

            Future<bool> exists() async {
              final p = await SharedPreferences.getInstance();
              return p.containsKey('vault_salt');
            }

            Future<void> create(String pass) async {
              final p = await SharedPreferences.getInstance();
              final salt = List<int>.generate(16, (_) => Random.secure().nextInt(256));
              final key = _pbkdf2(pass, salt, 1500, 32);
              _key = key;
              await p.setString('vault_salt', base64Encode(salt));
              await p.setString('vault_check', base64Encode(sha256.convert([...key, ...salt]).bytes));
              cards.clear();
              proxies.clear();
              unlocked = true;
              await save();
            }

            Future<bool> unlock(String pass) async {
              final p = await SharedPreferences.getInstance();
              final saltB64 = p.getString('vault_salt');
              if (saltB64 == null) return false;
              final salt = base64Decode(saltB64);
              final key = _pbkdf2(pass, salt, 1500, 32);
              final check = base64Encode(sha256.convert([...key, ...salt]).bytes);
              if (check != p.getString('vault_check')) return false;
              _key = key;
              await _load();
              unlocked = true;
              return true;
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              cards.clear();
              proxies.clear();
              final raw = p.getString('vault_data');
              if (raw == null || raw.isEmpty || !raw.contains(':')) return;
              try {
                final enc = base64Decode(raw.split(':')[1]);
                final ks = _stream(_key!, enc.length);
                final plain = List<int>.generate(enc.length, (i) => enc[i] ^ ks[i]);
                final j = jsonDecode(utf8.decode(plain)) as Map<String, dynamic>;
                for (final c in (j['cards'] as List? ?? const [])) {
                  cards.add(CreditCard.fromJson(Map<String, dynamic>.from(c as Map)));
                }
                for (final c in (j['proxies'] as List? ?? const [])) {
                  proxies.add(ProxyNode.fromJson(Map<String, dynamic>.from(c as Map)));
                }
              } catch (_) {}
            }

            Future<void> save() async {
              final key = _key;
              if (key == null) return;
              final p = await SharedPreferences.getInstance();
              final j = jsonEncode({
                'cards': cards.map((c) => c.toJson()).toList(),
