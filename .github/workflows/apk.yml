              final ext = ['csv', 'txt', 'json'][_fmt];
              final f = File('${dir.path}/ccheker_${_scopeNames[_scope]}_${DateTime.now().millisecondsSinceEpoch}.$ext');
              await f.writeAsString(_content(list));
