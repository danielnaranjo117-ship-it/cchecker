              if (_buf.length < n) throw 'conexión cerrada';
              final out = _buf.sublist(0, n);
              _buf.removeRange(0, n);
              return out;
            }

            Future<int> byte() async {
              while (_buf.isEmpty && !_done) {
                await _wait();
              }
              if (_buf.isEmpty) throw 'conexión cerrada';
              return _buf.removeAt(0);
            }

