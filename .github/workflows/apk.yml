          class SegmentedProgress extends StatelessWidget {
            const SegmentedProgress({super.key, required this.value, this.segments = 22});
            final double value;
            final int segments;

            @override
            Widget build(BuildContext context) => Row(
                  children: List.generate(segments, (i) {
                    final on = (i + 1) / segments <= value + 0.0001;
                    return Expanded(
                      child: Container(
                        margin: const EdgeInsets.symmetric(horizontal: 1),
                        height: 6,
                        decoration: BoxDecoration(
                          color: on ? AppColors.lime : AppColors.glassStroke,
                          borderRadius: BorderRadius.circular(3),
