          class _LockScreenState extends ConsumerState<LockScreen> {
            final _pin = <String>[];
            String? _first;
            String _msg = '';
            bool _needCreate = false;
            bool _busy = false;

            @override
            void initState() {
              super.initState();
              _boot();
            }

            Future<void> _boot() async {
              final exists = await Vault.i.exists();
              if (!mounted) return;
              setState(() {
                _needCreate = !exists;
                _msg = exists ? 'Ingresá tu PIN' : 'Creá un PIN nuevo';
              });
              if (exists && ref.read(settingsProvider).biometrics) _bio();
            }

            void _tap(String d) {
              if (_busy) return;
              setState(() => _pin.add(d));
              if (_pin.length == 6) _submit();
            }

            Future<void> _submit() async {
              final pin = _pin.join();
              if (_needCreate) {
                if (_first == null) {
                  setState(() {
                    _first = pin;
                    _pin.clear();
                    _msg = 'Repetí el PIN';
                  });
                  return;
                }
                if (_first != pin) {
                  setState(() {
                    _first = null;
                    _pin.clear();
                    _msg = 'No coinciden, de nuevo';
                  });
                  return;
                }
                await Vault.i.create(pin);
                _open();
                return;
              }
              _busy = true;
              final ok = await Vault.i.open(pin);
              _busy = false;
              if (!ok) {
                setState(() {
                  _pin.clear();
                  _msg = 'PIN incorrecto';
                });
                return;
              }
              _open();
            }

            void _open() {
              ref.read(cardsProvider.notifier).reload();
              ref.read(proxiesProvider.notifier).reload();
              ref.read(lockProvider.notifier).state = false;
            }

