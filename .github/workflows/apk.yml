            static const _fmtNames = ['CSV', 'TXT', 'JSON'];

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            List<CreditCard> _pick(List<CreditCard> all) => switch (_scope) {
                  1 => all,
                  2 => all.where((c) => c.status == CheckStatus.noFunds).toList(),
                  3 => all.where((c) => c.status == CheckStatus.review).toList(),
                  4 => all.where((c) => c.status == CheckStatus.dead).toList(),
                  5 => all.where((c) => c.status == CheckStatus.unknown).toList(),
                  6 => all.where((c) => c.status == CheckStatus.unchecked).toList(),
                  _ => all.where((c) => c.status == CheckStatus.live).toList(),
                };

            String _cell(String v) => v.contains(RegExp(r'[",\n]')) ? '"${v.replaceAll('"', '""')}"' : v;

            String _content(List<CreditCard> list) {
              if (_fmt == 1) return list.map((c) => c.line).join('\n');
              if (_fmt == 2) {
                return const JsonEncoder.withIndent('  ').convert({
                  'exportedAt': DateTime.now().toIso8601String(),
                  'scope': _scopeNames[_scope],
                  'total': list.length,
                  'cards': list.map((c) => c.toJson()).toList(),
                });
              }
              final b = StringBuffer('pan,mes,anio,cvv,zip,marca,nivel,banco,pais,avs,estado,respuesta\n');
              for (final c in list) {
                b.writeln([
                  c.pan,
                  c.expMonth,
                  c.expYear,
                  c.cvv,
                  c.zip,
                  _cell(c.brand),
                  _cell(c.level),
                  _cell(c.bank),
                  _cell(c.country),
                  c.avs,
                  c.status.name,
                  _cell(c.declineCode ?? ''),
                ].join(','));
              }
              return b.toString();
            }

