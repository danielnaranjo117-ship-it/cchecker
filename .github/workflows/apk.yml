          class Gate {
            Gate(this.cap);
            int cap;
            int _used = 0;
            final _q = <Completer<void>>[];

            Future<void> acquire() async {
              if (_used < cap) {
                _used++;
                return;
              }
              final c = Completer<void>();
              _q.add(c);
              await c.future;
            }

            void release() {
              if (_q.isNotEmpty) {
                _q.removeAt(0).complete();
              } else if (_used > 0) {
                _used--;
              }
            }

            void setCap(int v) {
