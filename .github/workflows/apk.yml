          class LabScreen extends ConsumerStatefulWidget {
            const LabScreen({super.key});
            @override
            ConsumerState<LabScreen> createState() => _LabScreenState();
          }

          class _LabScreenState extends ConsumerState<LabScreen> {
            final _bin = TextEditingController(text: '424242');
            final _val = TextEditingController();
            final _cmp = TextEditingController();
            int _count = 10;
            int _len = 16;
            String _valOut = '';
            String _cmpOut = '';
            bool _busy = false;

            @override
            void dispose() {
              _bin.dispose();
              _val.dispose();
              _cmp.dispose();
              super.dispose();
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            String _gen(String bin, int len) {
              final r = Random();
              var s = bin;
              while (s.length < len - 1) {
                s += r.nextInt(10).toString();
              }
              for (var d = 0; d < 10; d++) {
                final cand = '$s$d';
                if (luhn(cand)) return cand;
              }
              return '${s}0';
            }

            Future<void> _generate() async {
              final bin = _bin.text.replaceAll(RegExp(r'\D'), '');
              if (bin.length < 4) {
                _snack('Poné al menos 4 dígitos de BIN');
                return;
              }
              final r = Random();
              final out = <CreditCard>[];
              final year = DateTime.now().year % 100;
              for (var i = 0; i < _count; i++) {
                final pan = _gen(bin, _len);
                out.add(CreditCard(
                  id: newId(),
                  pan: pan,
                  expMonth: (r.nextInt(12) + 1).toString().padLeft(2, '0'),
                  expYear: '${year + 1 + r.nextInt(6)}',
                  cvv: List.generate(3, (_) => r.nextInt(10)).join(),
                  brand: schemeOf(pan),
                ));
              }
              final n = await ref.read(cardsProvider.notifier).addAll(out);
              _snack('$n generadas y guardadas');
            }

            void _validate() {
              final res = parseCards(_val.text);
              var bad = 0;
              var lines = 0;
              for (final l in _val.text.split(RegExp(r'[\r\n]+'))) {
                final t = l.trim();
                if (t.isEmpty) continue;
                lines++;
                final m = RegExp(r'(?<!\d)(\d{13,19})(?!\d)').firstMatch(t);
                if (m != null && !luhn(m.group(1)!)) bad++;
              }
              setState(() {
                _valOut = '$lines líneas · ${res.cards.length} válidas · ${res.duplicates} repetidas · '
                    '${res.junk} basura · $bad con Luhn inválido';
              });
            }

            void _compare() {
              final res = parseCards(_cmp.text);
              final have = ref.read(cardsProvider).map((c) => c.pan).toSet();
              final dup = res.cards.where((c) => have.contains(c.pan)).length;
              setState(() {
                _cmpOut = '${res.cards.length} con formato válido · ${res.cards.length - dup} nuevas · $dup ya en la bóveda';
              });
            }

            Future<void> _copyNew() async {
              final res = parseCards(_cmp.text);
              final have = ref.read(cardsProvider).map((c) => c.pan).toSet();
              final fresh = res.cards.where((c) => !have.contains(c.pan)).toList();
              if (fresh.isEmpty) {
                _snack('No hay nuevas');
                return;
              }
              await Clipboard.setData(ClipboardData(text: fresh.map((c) => c.line).join('\n')));
              _snack('${fresh.length} nuevas copiadas');
            }

            Future<void> _ping() async {
              final e = CheckEngine(ref.read(settingsProvider));
              final out = await e.probe(null, pan: '4242424242424242', mm: '12', yy: '34', cvv: '123');
              e.dispose();
              _snack(out.ok ? 'Stripe responde LIVE en ${out.ms} ms' : 'Stripe responde ${out.note} en ${out.ms} ms');
            }

