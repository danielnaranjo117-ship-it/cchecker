                        style: AppTextStyles.mono,
                        decoration: const InputDecoration(
                          hintText: 'Pegá líneas y analizo Luhn, repetidas y basura',
                          hintStyle: AppTextStyles.caption,
                          border: InputBorder.none,
                        ),
                      ),
                      const SizedBox(height: 10),
                      NeonButton(label: 'Analizar', icon: Icons.fact_check, color: AppColors.cyan, onPressed: _validate),
                      if (_valOut.isNotEmpty) ...[
