                            : CheckStatus.dead;
                return CheckOutcome(
                  ok: false,
                  error: status == CheckStatus.unknown,
                  ms: sw.elapsedMilliseconds,
                  note: code,
                  status: status,
                  code: code,
                );
              } catch (e) {
                sw.stop();
                return CheckOutcome(
                  ok: false,
                  error: true,
                  ms: sw.elapsedMilliseconds,
                  note: _short(e),
                  status: CheckStatus.unknown,
                );
              }
            }
