              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Generador Luhn'),
                  GlassPanel(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Row(children: [
                        Expanded(child: _f(_bin, 'BIN base (ej. 424242)')),
                        const SizedBox(width: 8),
                        SizedBox(width: 78, child: _f(null, 'largo')),
                      ]),
                      const SizedBox(height: 8),
                      Text('cantidad: $_count', style: AppTextStyles.body),
                      Slider(
                        value: _count.toDouble(),
                        min: 1,
                        max: 50,
                        divisions: 49,
                        activeColor: AppColors.lime,
                        onChanged: (v) => setState(() => _count = v.round()),
                      ),
                      Wrap(spacing: 10, runSpacing: 10, children: [
                        NeonButton(label: 'Generar y guardar', icon: Icons.auto_awesome, onPressed: _generate),
                        NeonButton(
                          label: '$_len dígitos',
                          color: AppColors.textMid,
                          onPressed: () => setState(() => _len = _len == 16 ? 15 : 16),
                        ),
                      ]),
                    ]),
                  ),
                  const SectionHeader('Validador'),
                  GlassPanel(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      TextField(
                        controller: _val,
