          import 'dart:convert';
          import 'dart:io';

          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';

          import 'models.dart';

          class BinDb {
            BinDb._();
            static final BinDb i = BinDb._();

            static const _url = 'https://raw.githubusercontent.com/iann838/bin-list-data/master/bin-list-data.csv';

            Map<String, BinInfo> _map = {};

            int get count => _map.length;

            Future<File> _file() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/bin_list.csv');
            }

            Future<File> _index() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/bin_index.json');
            }

            Future<bool> installed() async => (await _file()).exists();

            Future<void> download({void Function(int received, int total)? onProgress}) async {
              final f = await _file();
              final client = http.Client();
              try {
                final res = await client.send(http.Request('GET', Uri.parse(_url)));
                final total = res.contentLength ?? 0;
                var received = 0;
                final sink = f.openWrite();

                await for (final chunk in res.stream) {
                  sink.add(chunk);
                  received += chunk.length;
                  onProgress?.call(received, total);
                }
                await sink.flush();
                await sink.close();
              } finally {
                client.close();
              }
            }

            Future<int> buildIndex() async {
              final f = await _file();
              if (!await f.exists()) return 0;

              final lines = await f.readAsLines();
              final map = <String, BinInfo>{};

              for (var i = 1; i < lines.length; i++) {
                final line = lines[i];
                if (line.isEmpty) continue;
                final c = line.split(',');
                if (c.length < 8) continue;
                final bin = c[0].trim();
                if (bin.length < 6) continue;
                map[bin] = BinInfo(
                  bank: c[4].trim(),
                  country: c[5].trim(),
                  cardType: c[7].trim(),
                  level: c.length > 8 ? c[8].trim() : '',
                );
              }

              _map = map;
              final idx = await _index();
              await idx.writeAsString(jsonEncode(map.map((k, v) => MapEntry(k, v.toJson()))), flush: true);
              return map.length;
            }

            Future<void> loadIndex() async {
              if (_map.isNotEmpty) return;
              final idx = await _index();
              if (!await idx.exists()) return;
              final j = jsonDecode(await idx.readAsString()) as Map<String, dynamic>;
              _map = j.map((k, v) => MapEntry(k, BinInfo.fromJson(v as Map<String, dynamic>)));
            }

            BinInfo? lookup(String pan) {
              if (pan.length < 6) return null;
              final exact = _map[pan.substring(0, 6)];
              if (exact != null) return exact;
              for (var len = 5; len >= 3; len--) {
                final hit = _map[pan.substring(0, len)];
                if (hit != null) return hit;
              }
              return null;
            }

            Future<void> drop() async {
              _map = {};
              for (final f in [await _file(), await _index()]) {
                if (await f.exists()) await f.delete();
              }
            }
          }
