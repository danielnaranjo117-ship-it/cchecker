          class ProxiesScreen extends ConsumerStatefulWidget {
            const ProxiesScreen({super.key});
            @override
            ConsumerState<ProxiesScreen> createState() => _ProxiesScreenState();
          }

          class _ProxiesScreenState extends ConsumerState<ProxiesScreen> {
            final _host = TextEditingController();
            final _port = TextEditingController();
            final _user = TextEditingController();
            final _pass = TextEditingController();

            @override
            void dispose() {
              _host.dispose();
              _port.dispose();
              _user.dispose();
              _pass.dispose();
              super.dispose();
            }

            Future<void> _add() async {
              final host = _host.text.trim();
              final port = int.tryParse(_port.text.trim()) ?? 0;
              if (host.isEmpty || port == 0) return;
              await ref.read(proxiesProvider.notifier).upsert(ProxyNode(
                    id: newId(),
                    host: host,
                    port: port,
                    user: _user.text.trim(),
                    pass: _pass.text.trim(),
                  ));
              _host.clear();
              _port.clear();
              _user.clear();
              _pass.clear();
            }

            Future<void> _probeAll() async {
              final cfg = ref.read(settingsProvider);
              final engine = CheckEngine(cfg);
              final list = ref.read(proxiesProvider);
              for (final p in list) {
                final out = await engine.probe(p);
                await ref.read(proxiesProvider.notifier).setHealth(p.id, out.ok ? ProxyHealth.up : ProxyHealth.down, out.ms);
              }
            }

            @override
            Widget build(BuildContext context) {
              final list = ref.watch(proxiesProvider);
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Agregar proxy'),
                  GlassPanel(
                    child: Column(children: [
                      _f(_host, 'host'),
                      const SizedBox(height: 8),
                      Row(children: [
                        Expanded(child: _f(_port, 'puerto')),
                        const SizedBox(width: 8),
                        Expanded(child: _f(_user, 'user (opcional)')),
                      ]),
                      const SizedBox(height: 8),
                      _f(_pass, 'pass (opcional)'),
                      const SizedBox(height: 12),
                      NeonButton(label: 'Agregar', icon: Icons.add, onPressed: _add),
                    ]),
                  ),
                  const SectionHeader('Lista'),
                  Row(children: [
                    NeonButton(
                        label: 'Probar todos',
                        icon: Icons.speed,
                        color: AppColors.cyan,
                        onPressed: list.isEmpty ? null : _probeAll),
                  ]),
                  const SizedBox(height: 12),
                  ...list.map((p) => Padding(
                        padding: const EdgeInsets.only(bottom: 10),
                        child: GlassPanel(
                          child: Row(children: [
                            Expanded(
                              child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                Text(p.label, style: AppTextStyles.mono),
                                const SizedBox(height: 4),
                                Text(
                                  p.health == ProxyHealth.up
                                      ? 'ok · ${p.latencyMs} ms'
                                      : p.health == ProxyHealth.down
                                          ? 'caído'
                                          : 'sin probar',
                                  style: AppTextStyles.caption,
                                ),
                              ]),
                            ),
                            StatusPill(
                              text: p.health.name,
                              color: p.health == ProxyHealth.up
                                  ? AppColors.lime
                                  : p.health == ProxyHealth.down
                                      ? AppColors.red
                                      : AppColors.textLo,
                            ),
                            IconButton(
                              icon: const Icon(Icons.delete_outline, size: 20, color: AppColors.textLo),
                              onPressed: () => ref.read(proxiesProvider.notifier).remove(p.id),
                            ),
                          ]),
                        ),
                      )),
                ],
              );
            }

            Widget _f(TextEditingController c, String hint) => TextField(
                  controller: c,
                  style: AppTextStyles.body,
                  decoration: InputDecoration(
                    hintText: hint,
                    hintStyle: AppTextStyles.caption,
                    filled: true,
                    fillColor: AppColors.bg,
                    border: OutlineInputBorder(borderRadius: BorderRadius.circular(10), borderSide: BorderSide.none),
                  ),
                );
          }
          DART

          cat > lib/screens/reports.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:path_provider/path_provider.dart';
          import '../core.dart';
          import '../providers.dart';
          import '../theme.dart';
          import '../widgets.dart';

          class ReportsScreen extends ConsumerWidget {
            const ReportsScreen({super.key});

            Future<void> _export(BuildContext context, WidgetRef ref) async {
              final cards = ref.read(cardsProvider);
              final dir = await getApplicationDocumentsDirectory();
              final f = File('${dir.path}/ccheker_export_${DateTime.now().millisecondsSinceEpoch}.json');
              await f.writeAsString(const JsonEncoder.withIndent('  ').convert({
                'exportedAt': DateTime.now().toIso8601String(),
                'total': cards.length,
                'cards': cards.map((c) => c.toJson()).toList(),
              }));
              if (!context.mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Exportado: ${f.path}')));
            }

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final stats = ref.watch(statsProvider);
              final cards = ref.watch(cardsProvider);
              final live = cards.where((c) => c.status.name == 'live').length;
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Sesión actual'),
                  Row(children: [
                    StatTile(label: 'probadas', value: fmtInt(stats.done), color: AppColors.cyan),
                    const SizedBox(width: 10),
                    StatTile(label: 'vivas', value: fmtInt(stats.live), color: AppColors.lime),
                    const SizedBox(width: 10),
                    StatTile(label: 'caídas', value: fmtInt(stats.dead), color: AppColors.red),
                  ]),
                  const SizedBox(height: 10),
                  Row(children: [
                    StatTile(label: 'errores', value: fmtInt(stats.errors), color: AppColors.amber),
                    const SizedBox(width: 10),
                    StatTile(label: 'hit rate', value: fmtPct(stats.hitRate), color: AppColors.violet),
                  ]),
                  const SectionHeader('Bóveda'),
                  GlassPanel(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text('${fmtInt(cards.length)} tarjetas · $live vivas', style: AppTextStyles.body),
                      const SizedBox(height: 12),
                      NeonButton(label: 'Exportar JSON', icon: Icons.ios_share, onPressed: () => _export(context, ref)),
                    ]),
                  ),
                ],
              );
            }
          }
          DART

          cat > lib/screens/settings.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import '../core.dart';
          import '../providers.dart';
          import '../theme.dart';
          import '../widgets.dart';

          class SettingsScreen extends ConsumerStatefulWidget {
            const SettingsScreen({super.key});
            @override
            ConsumerState<SettingsScreen> createState() => _SettingsScreenState();
          }

          class _SettingsScreenState extends ConsumerState<SettingsScreen> {
            late final TextEditingController _probe;

            @override
            void initState() {
              super.initState();
              _probe = TextEditingController(text: ref.read(settingsProvider).probeUrl);
            }

            @override
            void dispose() {
              _probe.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final s = ref.watch(settingsProvider);
              final n = ref.read(settingsProvider.notifier);
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Motor'),
                  GlassPanel(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text('Concurrencia: ${s.concurrency}', style: AppTextStyles.body),
                      Slider(
                        value: s.concurrency.toDouble(),
                        min: 1,
                        max: 16,
                        divisions: 15,
                        activeColor: AppColors.lime,
                        onChanged: (v) => n.setConcurrency(v.round()),
                      ),
                      Text('Timeout: ${s.timeoutSec}s', style: AppTextStyles.body),
                      Slider(
                        value: s.timeoutSec.toDouble(),
                        min: 5,
                        max: 60,
                        divisions: 11,
                        activeColor: AppColors.cyan,
                        onChanged: (v) => n.setTimeout(v.round()),
                      ),
                      const SizedBox(height: 6),
                      TextField(
                        controller: _probe,
                        style: AppTextStyles.mono,
                        onSubmitted: n.setProbeUrl,
                        decoration: const InputDecoration(labelText: 'URL de prueba', labelStyle: AppTextStyles.caption),
                      ),
                    ]),
                  ),
                  const SectionHeader('Seguridad'),
                  GlassPanel(
                    child: Column(children: [
                      SwitchListTile(
                        contentPadding: EdgeInsets.zero,
                        title: const Text('Biometría', style: AppTextStyles.body),
                        value: s.biometrics,
                        activeColor: AppColors.lime,
                        onChanged: n.setBiometrics,
                      ),
                      Text('Auto-lock: ${s.autoLockMin} min', style: AppTextStyles.body),
                      Slider(
                        value: s.autoLockMin.toDouble(),
                        min: 0,
                        max: 30,
                        divisions: 6,
                        activeColor: AppColors.violet,
                        onChanged: (v) => n.setAutoLock(v.round()),
                      ),
                    ]),
                  ),
                  const SectionHeader('Zona peligrosa'),
                  GlassPanel(
                    child: Column(children: [
                      NeonButton(
                        label: 'Vaciar bóveda',
                        color: AppColors.red,
                        icon: Icons.delete_forever,
                        onPressed: () async {
                          await ref.read(cardsProvider.notifier).clear();
                          if (!context.mounted) return;
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Bóveda vaciada')));
                        },
                      ),
                      const SizedBox(height: 10),
                      NeonButton(
                        label: 'Bloquear ahora',
                        color: AppColors.textMid,
                        icon: Icons.lock_outline,
                        onPressed: () {
                          Vault.i.lock();
                          ref.read(lockProvider.notifier).state = true;
                        },
                      ),
                    ]),
                  ),
                ],
              );
            }
          }
          DART

          MAN="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$MAN" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MAN"
          grep -q 'USE_BIOMETRIC' "$MAN" || sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' "$MAN"

          for g in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$g" ] || continue
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$g"
            sed -i 's/minSdkVersion = flutter\.minSdkVersion/minSdkVersion = 23/' "$g"
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' "$g"
          done

          MA="$(find android/app/src/main -name 'MainActivity.kt' | head -1 || true)"
          if [ -n "${MA:-}" ]; then
            python3 - "$MA" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          s = s.replace('FlutterActivity', 'FlutterFragmentActivity')
          p.write_text(s)
          PY
          fi

          flutter pub get
          flutter build apk --release

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CCheker build ${{ github.run_number }}
          files: ccheker_live/build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ccheker_live/build/app/outputs/flutter-apk/app-release.apk
