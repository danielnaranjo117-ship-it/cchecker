                          const SizedBox(height: 28),
                          Text(_msg, style: AppTextStyles.body),
                          const SizedBox(height: 20),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: List.generate(
                              6,
                              (i) => Container(
                                width: 14,
                                height: 14,
                                margin: const EdgeInsets.symmetric(horizontal: 6),
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: i < _pin.length ? AppColors.lime : Colors.transparent,
                                  border: Border.all(color: AppColors.glassStrokeHi),
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(height: 28),
                          Wrap(
                            spacing: 16,
                            runSpacing: 16,
                            alignment: WrapAlignment.center,
                            children: [
                              for (final d in ['1', '2', '3', '4', '5', '6', '7', '8', '9']) _key(d, () => _tap(d)),
                              _key('bio', _bio, icon: Icons.fingerprint),
