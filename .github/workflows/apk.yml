                final ok = await auth.authenticate(
                  localizedReason: 'Desbloquear CCheker Live',
                  options: const AuthenticationOptions(biometricOnly: false, stickyAuth: true),
                );
                if (!ok) return;
                if (!Vault.i.isOpen && mounted) setState(() => _msg = 'Ingresá tu PIN');
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
