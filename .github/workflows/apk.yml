                      ),
                    ),
                    const SizedBox(height: 14),
                    NeonButton(
                      label: _busy ? 'Procesando $_progress' : 'Guardar ${fmtInt(res.cards.length)} en la boveda',
                      icon: Icons.save_alt,
                      onPressed: res.cards.isEmpty || _busy ? null : _commit,
                    ),
                  ],
                ],
              );
            }
