            }

            Future<void> addAll(List<CreditCard> list) async {
              state = [...list, ...state];
              await persist();
            }

            Future<void> replaceAll(List<CreditCard> list) async {
              state = list;
              await persist();
            }

            Future<void> clear() async {
              state = const [];
              await persist();
            }

            Future<void> remove(String id) async {
              state = state.where((c) => c.id != id).toList();
              await persist();
            }

            void setStatus(String id, CheckStatus s) {
              state = state.map((c) => c.id == id ? c.copyWith(status: s) : c).toList();
            }

            Future<void> apply(String id, CheckResult r) async {
              state = state
                  .map((c) => c.id == id
                      ? c.copyWith(
                          status: r.status,
                          message: r.message,
                          gateway: r.gateway,
                          latencyMs: r.latencyMs,
                          checkedAt: DateTime.now(),
                        )
                      : c)
                  .toList();
            }

            Future<void> update(CreditCard card) async {
              state = state.map((c) => c.id == card.id ? card : c).toList();
              await persist();
            }
          }

          final proxiesProvider = StateNotifierProvider<ProxiesNotifier, List<ProxyNode>>((ref) => ProxiesNotifier());

          class ProxiesNotifier extends StateNotifier<List<ProxyNode>> {
            ProxiesNotifier() : super(const []) {
              final raw = Vault.i.data['proxies'];
              if (raw is List) {
                state = raw.map((e) => ProxyNode.fromJson(e as Map<String, dynamic>)).toList();
              }
            }

            Future<void> persist() async {
              Vault.i.data['proxies'] = state.map((p) => p.toJson()).toList();
              await Vault.i.save();
            }

            Future<void> upsert(ProxyNode p) async {
              state = [...state.where((x) => x.id != p.id), p];
              await persist();
            }

            Future<void> remove(String id) async {
              state = state.where((p) => p.id != id).toList();
              await persist();
            }

            Future<void> setHealth(String id, ProxyHealth h, int ms) async {
              state = state.map((p) {
                if (p.id != id) return p;
                p.health = h;
                p.latencyMs = ms;
                return p;
              }).toList();
              await persist();
            }
          }

          final netProvider = StateNotifierProvider<NetNotifier, NetSense>((ref) {
            final n = NetNotifier();
            n.start();
            ref.onDispose(n.stop);
            return n;
          });

          class NetNotifier extends StateNotifier<NetSense> {
            NetNotifier() : super(NetSense.i);
            StreamSubscription? _s;

            void start() {
              NetSense.i.start();
              _s = NetSense.i.changes.listen((_) {
                if (mounted) state = NetSense.i;
              });
            }

            void stop() {
              _s?.cancel();
              NetSense.i.stop();
            }
          }

          final lockProvider = StateProvider<bool>((ref) => true);
          final binStatusProvider = StateProvider<BinStatus>((ref) => const BinStatus());

          class RunStats {
            const RunStats({this.total = 0, this.done = 0, this.live = 0, this.dead = 0, this.errors = 0, this.avgMs = 0});
            final int total;
            final int done;
            final int live;
            final int dead;
            final int errors;
            final int avgMs;

            double get pct => total == 0 ? 0 : done / total;
            double get hitRate => done == 0 ? 0 : live / done;
          }

          final statsProvider = StateNotifierProvider<StatsNotifier, RunStats>((ref) => StatsNotifier());

          class StatsNotifier extends StateNotifier<RunStats> {
            StatsNotifier() : super(const RunStats());

            void reset(int total) => state = RunStats(total: total);

            void tick({required int done, required int live, required int dead, required int errors, required int avgMs}) =>
                state = RunStats(total: state.total, done: done, live: live, dead: dead, errors: errors, avgMs: avgMs);
          }

          final runProvider = StateNotifierProvider<RunController, bool>((ref) => RunController(ref));

          class RunController extends StateNotifier<bool> {
            RunController(this.ref) : super(false);
            final Ref ref;
            bool _cancel = false;

            void cancel() => _cancel = true;

            Future<void> run({List<String>? ids}) async {
              if (state) return;
              state = true;
              _cancel = false;

              final settings = ref.read(settingsProvider);
              final proxies = ref.read(proxiesProvider);
              final all = ref.read(cardsProvider);
              final targets = ids == null ? all : all.where((c) => ids.contains(c.id)).toList();

              if (targets.isEmpty) {
                state = false;
                return;
              }

              await BinDb.i.loadIndex();

              var conc = settings.autoTune ? NetSense.i.concurrency : settings.concurrency;
              conc = conc.clamp(1, 16);

              var cursor = 0;
              var done = 0;
              var live = 0;
              var dead = 0;
              var errors = 0;
              var msSum = 0;

              final cards = ref.read(cardsProvider.notifier);
              final stats = ref.read(statsProvider.notifier);
              stats.reset(targets.length);

              Future<void> worker() async {
                while (!_cancel) {
                  final i = cursor;
                  if (i >= targets.length) return;
                  cursor++;

                  final card = targets[i];
                  cards.setStatus(card.id, CheckStatus.checking);

                  final engine = CheckEngine(settings, proxies: proxies);
                  final r = await engine.check(card);

                  if (r.status == CheckStatus.live) live++;
                  if (r.status == CheckStatus.dead) dead++;
                  if (r.status == CheckStatus.unknown) errors++;

                  msSum += r.latencyMs;
                  done++;

                  await cards.apply(card.id, r);
                  stats.tick(
                    done: done,
                    live: live,
                    dead: dead,
                    errors: errors,
                    avgMs: done == 0 ? 0 : msSum ~/ done,
                  );

                  if (settings.autoTune && NetSense.i.concurrency > conc && cursor < targets.length) {
                    conc = NetSense.i.concurrency;
                    unawaited(worker());
                  }
                }
              }

              await Future.wait(List.generate(conc, (_) => worker()));
              await cards.persist();
              state = false;
            }
          }
